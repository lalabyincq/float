<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>浮岛记 (Float) - 星际风格2.5D</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { width: 100%; height: 100%; overflow: hidden; background: #0a0c12; color: #e6e6e6; font-family: -apple-system, "PingFang SC", sans-serif; touch-action: none; user-select: none; }
  #game { display: block; width: 100vw; height: 100vh; }
  #ui-top { position: fixed; top: env(safe-area-inset-top, 0); left: 0; right: 0; padding: 8px 12px; background: rgba(15,18,24,0.85); font-size: 13px; display: flex; flex-wrap: wrap; gap: 8px 16px; align-items: center; pointer-events: none; }
  .hunger-wrap { display: flex; align-items: center; gap: 6px; }
  .hunger-bar { width: 120px; height: 12px; background: #333; border-radius: 6px; overflow: hidden; }
  .hunger-fill { height: 100%; background: #e0a028; transition: width .2s; }
  .hunger-fill.low { background: #c83828; }
  .stat { white-space: nowrap; }
  #daynight-bar { position: fixed; top: calc(env(safe-area-inset-top, 0) + 52px); left: 12px; width: 200px; height: 18px; border-radius: 9px; overflow: hidden; display: flex; background: #222; pointer-events: none; }
  .dn-day { flex: 1; background: linear-gradient(90deg, #4a90c2, #f5d76e); }
  .dn-night { flex: 1; background: linear-gradient(90deg, #2c3e6b, #1a1a3e); }
  .dn-icon { position: absolute; top: 0; height: 18px; line-height: 18px; font-size: 14px; transform: translateX(-50%); transition: left 0.3s; }
  .dn-label { position: absolute; top: 0; left: 50%; transform: translateX(-50%); height: 18px; line-height: 18px; font-size: 11px; color: #fff; text-shadow: 0 0 3px #000; }
  .hint { position: fixed; top: calc(env(safe-area-inset-top, 0) + 95px); left: 12px; font-size: 11px; color: #888; pointer-events: none; }
  #joystick { position: fixed; left: 30px; bottom: calc(40px + env(safe-area-inset-bottom, 0)); width: 110px; height: 110px; border-radius: 50%; background: rgba(255,255,255,0.08); border: 2px solid rgba(255,255,255,0.2); touch-action: none; }
  #stick { position: absolute; left: 50%; top: 50%; transform: translate(-50%,-50%); width: 48px; height: 48px; border-radius: 50%; background: rgba(255,140,60,0.7); border: 2px solid rgba(255,255,255,0.4); }
  .btn { position: fixed; width: 60px; height: 60px; border-radius: 50%; background: rgba(40,90,60,0.8); border: 2px solid rgba(120,220,160,0.5); color: #eafff0; font-size: 12px; font-weight: bold; display: flex; align-items: center; justify-content: center; touch-action: none; }
  .btn:active { background: rgba(60,140,90,0.9); }
  #btn-jump { right: 30px; bottom: calc(210px + env(safe-area-inset-bottom, 0)); background: rgba(60,50,90,0.8); border-color: rgba(180,150,255,0.5); }
  #btn-fish { right: 110px; bottom: calc(140px + env(safe-area-inset-bottom, 0)); background: rgba(30,60,90,0.8); border-color: rgba(100,180,255,0.5); }
  #btn-collect { right: 30px; bottom: calc(140px + env(safe-area-inset-bottom, 0)); }
  #btn-deposit { right: 110px; bottom: calc(60px + env(safe-area-inset-bottom, 0)); background: rgba(90,40,40,0.8); border-color: rgba(220,120,120,0.5); }
  #btn-eat { right: 30px; bottom: calc(60px + env(safe-area-inset-bottom, 0)); background: rgba(90,70,30,0.8); border-color: rgba(220,180,80,0.5); }
</style>
</head>
<body>
<canvas id="game"></canvas>
<div id="ui-top">
  <div class="hunger-wrap"><span>饥饱</span><div class="hunger-bar"><div id="hunger-fill" class="hunger-fill"></div></div><span id="hunger-val">100</span></div>
  <div class="stat">背包: <span id="inv">水晶0 兽皮0 木材0 鱼0</span></div>
  <div class="stat">营地: <span id="sto">水晶0 兽皮0 木材0 鱼0</span></div>
</div>
<div id="daynight-bar"><div class="dn-day"></div><div class="dn-night"></div><div class="dn-icon" id="dn-icon">☀</div><div class="dn-label" id="dn-label">白天</div></div>
<div class="hint">左摇杆移动(八方向) · 跳跃上陡坡</div>
<div id="joystick"><div id="stick"></div></div>
<div class="btn" id="btn-jump">跳跃</div>
<div class="btn" id="btn-fish">捕鱼</div>
<div class="btn" id="btn-collect">采集</div>
<div class="btn" id="btn-deposit">存仓</div>
<div class="btn" id="btn-eat">进食</div>
<div id="message"></div>

<script>
// ========== 配置 ==========
const TW = 64, TH = 32; // 等距瓦片宽高(2:1)
const ELEV = 8; // 每单位高度的像素偏移
const MAP_W = 48, MAP_H = 48;
const VISION_NEAR = 6, VISION_FAR = 10;
const WATER=0, GRASS=1, SAND=2, ROCK=3, TREE=4, HOME=5;
const DAY_SPEED = 100 / 600 / 60;
const HUNGER_RATE = 100 / 4200 / 60;
const MOVE_SPEED = 3.0; // 格/秒

// 颜色插值工具
function lerpColor(c1, c2, t) {
  const r1=parseInt(c1.slice(1,3),16), g1=parseInt(c1.slice(3,5),16), b1=parseInt(c1.slice(5,7),16);
  const r2=parseInt(c2.slice(1,3),16), g2=parseInt(c2.slice(3,5),16), b2=parseInt(c2.slice(5,7),16);
  const r=Math.round(r1+(r2-r1)*t), g=Math.round(g1+(g2-g1)*t), b=Math.round(b1+(b2-b1)*t);
  return `rgb(${r},${g},${b})`;
}

// ========== 噪声(平滑) ==========
function makeNoise(seed) {
  const rand = mulberry32(seed);
  const grid = {};
  const get = (x, y) => {
    const k = `${x},${y}`;
    if (!(k in grid)) grid[k] = rand();
    return grid[k];
  };
  const smooth = (t) => t*t*(3-2*t);
  return (x, y) => {
    const x0 = Math.floor(x), y0 = Math.floor(y);
    const fx = smooth(x - x0), fy = smooth(y - y0);
    const a = get(x0, y0), b = get(x0+1, y0), c = get(x0, y0+1), d = get(x0+1, y0+1);
    return (a*(1-fx) + b*fx)*(1-fy) + (c*(1-fx) + d*fx)*fy;
  };
}

function mulberry32(a) {
  return function() { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; };
}

// ========== 岛屿生成(缓坡为主) ==========
class Island {
  constructor(seed=42) {
    this.rand = mulberry32(seed);
    this.tiles = Array.from({length:MAP_H}, () => Array(MAP_W).fill(WATER));
    this.elev = Array.from({length:MAP_H}, () => Array(MAP_W).fill(0));
    this.obsHeight = Array.from({length:MAP_H}, () => Array(MAP_W).fill(0));
    this.resources = {};
    this.memory = Array.from({length:MAP_H}, () => Array(MAP_W).fill(false));
    this._generate();
  }
  _generate() {
    const cx = MAP_W/2, cy = MAP_H/2, baseR = 17;
    const noise1 = makeNoise(this.rand()*9999);
    const noise2 = makeNoise(this.rand()*9999);

    // 先生成地形和高度(平滑噪声 → 缓坡)
    for (let y=0;y<MAP_H;y++) for (let x=0;x<MAP_W;x++) {
      const dist = Math.hypot(x-cx, y-cy);
      const edgeNoise = (noise1(x*0.15, y*0.15)-0.5)*5;
      const r = baseR + edgeNoise;
      if (dist < r-2.5) {
        this.tiles[y][x] = GRASS;
        // 平滑高度：中心高，边缘低，噪声起伏 → 缓坡
        const baseH = (1 - dist/baseR) * 3;
        const bump = (noise1(x*0.08, y*0.08) - 0.5) * 2;
        this.elev[y][x] = Math.max(0, baseH + bump);
      } else if (dist < r) {
        this.tiles[y][x] = SAND;
        // 沙地高度从边缘0平滑过渡到内侧 ~0.5
        const t = (r - dist) / 2.5;
        this.elev[y][x] = Math.max(0, 0.1 + t*0.4 + (noise2(x*0.2,y*0.2)-0.5)*0.15);
      } else if (dist < r+2.5) {
        this.tiles[y][x] = WATER;
        this.elev[y][x] = 0; // 海平面统一为0, 与沙地直接相连
      }
    }

    // 撒树和石头(只在较高处)
    for (let y=0;y<MAP_H;y++) for (let x=0;x<MAP_W;x++) {
      if (this.tiles[y][x] === GRASS && this.elev[y][x] > 0.5) {
        const r = this.rand();
        if (r < 0.06) { this.tiles[y][x] = TREE; this.obsHeight[y][x] = 2 + Math.floor(this.rand()*2); }
        else if (r < 0.08) { this.tiles[y][x] = ROCK; this.obsHeight[y][x] = 1 + Math.floor(this.rand()*2); }
      }
    }
    // 资源
    for (let i=0;i<20;i++) {
      const x = 3 + Math.floor(this.rand()*(MAP_W-6));
      const y = 3 + Math.floor(this.rand()*(MAP_H-6));
      if (this.tiles[y][x] === GRASS || this.tiles[y][x] === SAND)
        this.resources[`${x},${y}`] = ['crystal','hide','wood'][Math.floor(this.rand()*3)];
    }
    this.home = {x: Math.floor(cx), y: Math.floor(cy)};
    this.tiles[this.home.y][this.home.x] = HOME;
    this.obsHeight[this.home.y][this.home.x] = 0;
  }
  // 双线性插值取高度(平滑)
  getElevAt(x, y) {
    if (x<0||x>=MAP_W-1||y<0||y>=MAP_H-1) return 0;
    const x0=Math.floor(x), y0=Math.floor(y);
    const fx=x-x0, fy=y-y0;
    const e00=this.elev[y0][x0], e10=this.elev[y0][x0+1];
    const e01=this.elev[y0+1][x0], e11=this.elev[y0+1][x0+1];
    return e00*(1-fx)*(1-fy) + e10*fx*(1-fy) + e01*(1-fx)*fy + e11*fx*fy;
  }
  walkable(x, y) {
    const ix=Math.round(x), iy=Math.round(y);
    if (ix<0||ix>=MAP_W||iy<0||iy>=MAP_H) return false;
    const t = this.tiles[iy][ix];
    if (t === WATER || t === TREE) return false;
    if (t === ROCK) return this.obsHeight[iy][ix] <= 1;
    return true;
  }
}

// ========== 玩家(像素级平滑移动) ==========
class Player {
  constructor(x, y) { this.x=x; this.y=y; this.hunger=100;
    this.inv={crystal:0,hide:0,wood:0,fish:0}; this.storage={crystal:0,hide:0,wood:0,fish:0};
    this.vx=0; this.vy=0; this.jumpTimer=0; }
  getHeight(island) { return island.getElevAt(this.x, this.y); }
  collect(island) {
    const ix=Math.round(this.x), iy=Math.round(this.y);
    const k = `${ix},${iy}`;
    if (k in island.resources) { const r=island.resources[k]; delete island.resources[k]; this.inv[r]++; return r; }
    return null;
  }
  deposit() { for (const k in this.inv) { this.storage[k]+=this.inv[k]; this.inv[k]=0; } }
}

// ========== 游戏 ==========
class Game {
  constructor() {
    this.canvas = document.getElementById('game');
    this.ctx = this.canvas.getContext('2d');
    this.resize();
    window.addEventListener('resize', () => this.resize());
    this.island = new Island(Math.floor(Math.random()*9999)+1);
    this.player = new Player(this.island.home.x, this.island.home.y);
    this.camX = 0; this.camY = 0;
    this.dayTime = 0;
    this.moveDX = 0; this.moveDY = 0;
    this.jumpQueued = false;
    this.msg = ''; this.msgTimer = 0;
    this.lastTime = performance.now();
    this.setupInput();
    this.updateUI();
    requestAnimationFrame(() => this.loop());
  }
  resize() {
    this.W = window.innerWidth; this.H = window.innerHeight;
    this.canvas.width = this.W * devicePixelRatio; this.canvas.height = this.H * devicePixelRatio;
    this.canvas.style.width = this.W+'px'; this.canvas.style.height = this.H+'px';
    this.ctx.scale(devicePixelRatio, devicePixelRatio);
  }
  // 等距坐标转换
  toScreen(x, y, elev=0) {
    return { sx: (x - y) * TW/2, sy: (x + y) * TH/2 - elev * ELEV };
  }
  setupInput() {
    const joy = document.getElementById('joystick'), stick = document.getElementById('stick');
    let active=false, cx=0, cy=0;
    const setStick = (dx, dy) => { const max=40; const len=Math.hypot(dx,dy); if(len>max){dx=dx/len*max;dy=dy/len*max;} stick.style.transform=`translate(calc(-50% + ${dx}px), calc(-50% + ${dy}px))`; this.moveDX=dx/max; this.moveDY=dy/max; };
    joy.addEventListener('touchstart', e=>{e.preventDefault();active=true;const r=joy.getBoundingClientRect();cx=r.left+r.width/2;cy=r.top+r.height/2;});
    joy.addEventListener('touchmove', e=>{e.preventDefault();if(!active)return;const t=e.touches[0];setStick(t.clientX-cx,t.clientY-cy);});
    const end=e=>{e.preventDefault();active=false;setStick(0,0);stick.style.transform='translate(-50%,-50%)';};
    joy.addEventListener('touchend',end);joy.addEventListener('touchcancel',end);
    document.getElementById('btn-jump').addEventListener('touchstart',e=>{e.preventDefault();this.jumpQueued=true;});
    document.getElementById('btn-fish').addEventListener('touchstart',e=>{e.preventDefault();this.doFish();});
    document.getElementById('btn-collect').addEventListener('touchstart',e=>{e.preventDefault();this.doCollect();});
    document.getElementById('btn-deposit').addEventListener('touchstart',e=>{e.preventDefault();this.doDeposit();});
    document.getElementById('btn-eat').addEventListener('touchstart',e=>{e.preventDefault();this.doEat();});
    const keys={};
    window.addEventListener('keydown',e=>{keys[e.key]=true;if(e.key===' '){this.jumpQueued=true;e.preventDefault();}if(e.key==='e')this.doCollect();if(e.key==='q')this.doFish();if(e.key==='f')this.doDeposit();if(e.key==='r')this.doEat();});
    window.addEventListener('keyup',e=>keys[e.key]=false);
    this.getKeys=()=>{let dx=0,dy=0;if(keys['ArrowUp']||keys['w'])dy-=1;if(keys['ArrowDown']||keys['s'])dy+=1;if(keys['ArrowLeft']||keys['a'])dx-=1;if(keys['ArrowRight']||keys['d'])dx+=1;return{dx,dy};};
  }
  doCollect(){const r=this.player.collect(this.island);const names={crystal:'水晶',hide:'兽皮',wood:'木材'};this.showMsg(r?`采集到 ${names[r]}`:'这里没有资源');this.updateUI();}
  canFish(){const p=this.player,is=this.island;const ix=Math.round(p.x),iy=Math.round(p.y);if(is.tiles[iy][ix]!==SAND)return false;for(const[dx,dy]of[[1,0],[-1,0],[0,1],[0,-1]]){const nx=ix+dx,ny=iy+dy;if(nx>=0&&nx<MAP_W&&ny>=0&&ny<MAP_H&&is.tiles[ny][nx]===WATER)return true;}return false;}
  doFish(){if(!this.canFish()){this.showMsg('要站在沙滩(黄色)且旁边有水才能捕鱼');return;}if(Math.random()<0.7){this.player.inv.fish++;this.showMsg('捕到鱼了！🐟');}else this.showMsg('这次没捕到鱼...');this.updateUI();}
  doDeposit(){const ix=Math.round(this.player.x),iy=Math.round(this.player.y);if(ix===this.island.home.x&&iy===this.island.home.y){this.player.deposit();this.showMsg('资源已存入营地');}else this.showMsg('需回到营地(红框)才能存');this.updateUI();}
  doEat(){if(this.player.inv.fish>0){this.player.inv.fish--;this.player.hunger=Math.min(100,this.player.hunger+45);this.showMsg('吃鱼 +45');}else if(this.player.storage.fish>0){this.player.storage.fish--;this.player.hunger=Math.min(100,this.player.hunger+45);this.showMsg('营地吃鱼 +45');}else if(this.player.inv.hide>0){this.player.inv.hide--;this.player.hunger=Math.min(100,this.player.hunger+25);this.showMsg('吃兽皮 +25');}else if(this.player.storage.hide>0){this.player.storage.hide--;this.player.hunger=Math.min(100,this.player.hunger+25);this.showMsg('营地吃兽皮 +25');}else this.showMsg('没食物了！去捕鱼或打兽吧');this.updateUI();}
  showMsg(t){this.msg=t;this.msgTimer=90;}
  visible(x,y){const d=Math.hypot(x-this.player.x,y-this.player.y);if(d<=VISION_NEAR)return'near';if(d<=VISION_FAR)return'far';return null;}
  updateMemory(){const px=Math.round(this.player.x),py=Math.round(this.player.y);for(let dy=-VISION_FAR;dy<=VISION_FAR;dy++)for(let dx=-VISION_FAR;dx<=VISION_FAR;dx++){const tx=px+dx,ty=py+dy;if(tx>=0&&tx<MAP_W&&ty>=0&&ty<MAP_H)this.island.memory[ty][tx]=true;}}
  update(dt) {
    // 输入方向(八方向)
    let {dx,dy}=this.getKeys();
    if(dx===0&&dy===0){dx=this.moveDX;dy=this.moveDY;}
    const len=Math.hypot(dx,dy);
    if(len>0.1){dx/=len;dy/=len;}
    else{dx=0;dy=0;}

    // 尝试移动(平滑)
    if(dx||dy){
      const speed=MOVE_SPEED*dt;
      const nx=this.player.x+dx*speed, ny=this.player.y+dy*speed;
      const curH=this.island.getElevAt(this.player.x,this.player.y);
      const tgtH=this.island.getElevAt(nx,ny);
      const diff=tgtH-curH;
      const maxUp = this.jumpQueued ? 1.2 : 0.5; // 缓坡0.5可直接走, 跳跃可上1.2
      if(this.island.walkable(nx,ny) && diff <= maxUp && diff >= -2) {
        this.player.x=nx; this.player.y=ny;
        this.player.hunger=Math.max(0,this.player.hunger-dt*0.5);
      }
    }
    this.jumpQueued=false;

    // 相机平滑跟随
    const ph=this.player.getHeight(this.island);
    const targetCamX=this.player.x;
    const targetCamY=this.player.y;
    this.camX+=(targetCamX-this.camX)*0.1;
    this.camY+=(targetCamY-this.camY)*0.1;

    this.updateMemory();
    this.dayTime=(this.dayTime+DAY_SPEED*60*dt)%100;
    this.player.hunger=Math.max(0,this.player.hunger-HUNGER_RATE*60*dt);
    if(this.msgTimer>0)this.msgTimer--;
    this.updateUI();
  }
  // 取网格节点(i,j)处的高度(i,j 为瓦片角点坐标, 0..MAP_W/H)
  nodeElev(i,j){
    const is=this.island;
    if(i<0)i=0; if(j<0)j=0; if(i>=MAP_W)i=MAP_W-1; if(j>=MAP_H)j=MAP_H-1;
    // 角点高度 = 周围4个瓦片高度的平均(保证相邻瓦片共享角点, 无缝)
    let e=0,c=0;
    if(j>0&&i>0){e+=is.elev[j-1][i-1];c++;}
    if(j>0&&i<MAP_W){e+=is.elev[j-1][i];c++;}
    if(j<MAP_H&&i>0){e+=is.elev[j][i-1];c++;}
    if(j<MAP_H&&i<MAP_W){e+=is.elev[j][i];c++;}
    return c?e/c:0;
  }
  // 角点转屏幕坐标
  cornerScreen(i,j,e){
    const sx=(i-j)*TW/2;
    const sy=(i+j)*TH/2 - e*ELEV;
    return {x:sx+this.W/2-this.toScreen(this.camX,this.camY).sx,
            y:sy+this.H/2-this.toScreen(this.camX,this.camY).sy};
  }
  // 绘制单个等距瓦片(四角高度四边形 → 无缝缓坡)
  drawTile(x,y){
    const is=this.island;
    const t=is.tiles[y][x];
    const oh=is.obsHeight[y][x];
    const vis=this.visible(x,y);
    const mem=is.memory[y][x];
    if(vis!=='near'&&vis!=='far'&&!mem)return;

    // 四角高度(共享相邻瓦片 → 无裂缝)
    // 水面保持平面, 不被相邻陆地拉高
    const waterFlat = (t===WATER) ? 0 : null;
    const eNW=waterFlat!==null?waterFlat:this.nodeElev(x,y);
    const eNE=waterFlat!==null?waterFlat:this.nodeElev(x+1,y);
    const eSE=waterFlat!==null?waterFlat:this.nodeElev(x+1,y+1);
    const eSW=waterFlat!==null?waterFlat:this.nodeElev(x,y+1);
    const avgE=(eNW+eNE+eSE+eSW)/4;

    const pNW=this.cornerScreen(x,y,eNW);
    const pNE=this.cornerScreen(x+1,y,eNE);
    const pSE=this.cornerScreen(x+1,y+1,eSE);
    const pSW=this.cornerScreen(x,y+1,eSW);
    const cx=(pNW.x+pSE.x)/2, cy=(pNW.y+pSE.y)/2;

    // 瓦片颜色(按高度着色 → 缓坡感)
    let color;
    if(vis==='near'||vis==='far'){
      switch(t){
        case WATER: color = '#2a6a9a'; break;
        case GRASS: { const shade=Math.min(1,Math.max(0,avgE/4)); color=lerpColor('#2a5e32','#6aaa4a',shade); break; }
        case SAND: color=lerpColor('#c8b478','#b8a468',Math.min(1,avgE)); break;
        case ROCK: color='#8a7e72'; break;
        case TREE: color=lerpColor('#2a5e32','#6aaa4a',Math.min(1,avgE/4)); break;
        case HOME: color='#3c8246'; break;
      }
    } else { color='#1e232d'; }

    // 画四角四边形(轻微外扩0.5px覆盖亚像素缝隙)
    this.ctx.fillStyle=color;
    this.ctx.beginPath();
    this.ctx.moveTo(pNW.x, pNW.y);
    this.ctx.lineTo(pNE.x, pNE.y);
    this.ctx.lineTo(pSE.x, pSE.y);
    this.ctx.lineTo(pSW.x, pSW.y);
    this.ctx.closePath();
    this.ctx.fill();

    // 水波纹(仅水面)
    if(t===WATER&&(vis==='near'||vis==='far')){
      this.ctx.strokeStyle='rgba(255,255,255,0.12)';
      this.ctx.lineWidth=1;
      const w=Math.sin((x+y)*0.5+this.dayTime*0.1)*2;
      this.ctx.beginPath();
      this.ctx.moveTo((pNW.x+pSW.x)/2+w,(pNW.y+pSW.y)/2);
      this.ctx.lineTo((pNE.x+pSE.x)/2+w,(pNE.y+pSE.y)/2);
      this.ctx.stroke();
    }

    // 障碍物
    if(vis==='near'||vis==='far'){
      if(t===ROCK){
        const h=oh*ELEV;
        this.ctx.fillStyle='#6e6458';
        this.ctx.beginPath();
        this.ctx.ellipse(cx,cy-h,TW/3,TH/3,0,0,Math.PI*2);
        this.ctx.fill();
        this.ctx.fillStyle='#8a7e72';
        this.ctx.beginPath();
        this.ctx.ellipse(cx,cy-h-4,TW/3-2,TH/3-2,0,0,Math.PI*2);
        this.ctx.fill();
      } else if(t===TREE){
        const h=oh*ELEV;
        this.ctx.fillStyle='#5a3a1a';
        this.ctx.fillRect(cx-3,cy-h,6,h);
        this.ctx.fillStyle='#1e5028';
        this.ctx.beginPath();
        this.ctx.arc(cx,cy-h,TW/2.5,0,Math.PI*2);
        this.ctx.fill();
        this.ctx.fillStyle='#2a6a32';
        this.ctx.beginPath();
        this.ctx.arc(cx-4,cy-h-3,TW/4,0,Math.PI*2);
        this.ctx.fill();
      } else if(t===HOME){
        this.ctx.fillStyle='#c83c3c';
        this.ctx.fillRect(cx-14,cy-20,28,20);
        this.ctx.fillStyle='#8a2828';
        this.ctx.beginPath();
        this.ctx.moveTo(cx-16,cy-20);
        this.ctx.lineTo(cx,cy-32);
        this.ctx.lineTo(cx+16,cy-20);
        this.ctx.closePath();
        this.ctx.fill();
      }
    }

    // 资源
    if(vis==='near'&&is.resources[`${x},${y}`]){this.ctx.fillStyle='#78c8ff';this.ctx.beginPath();this.ctx.arc(cx,cy,6,0,Math.PI*2);this.ctx.fill();}
    else if(vis==='far'&&is.resources[`${x},${y}`]){this.ctx.fillStyle='#3c6478';this.ctx.beginPath();this.ctx.arc(cx,cy,4,0,Math.PI*2);this.ctx.fill();}
  }
  draw(){
    const ctx=this.ctx;
    ctx.fillStyle='#0a0c12';
    ctx.fillRect(0,0,this.W,this.H);

    // 计算可见范围(等距坐标)
    const center=this.toScreen(this.camX,this.camY);
    const rangeX=Math.ceil(this.W/TW)+3, rangeY=Math.ceil(this.H/TH)+6;
    const cx0=Math.floor(this.camX)-rangeX, cx1=Math.ceil(this.camX)+rangeX;
    const cy0=Math.floor(this.camY)-rangeY, cy1=Math.ceil(this.camY)+rangeY;

    // 按等距顺序绘制(从后到前)
    for(let s=cx0+cy0; s<=cx1+cy1; s++){
      for(let x=Math.max(cx0,s-cy1); x<=Math.min(cx1,s-cy0); x++){
        const y=s-x;
        if(x>=0&&x<MAP_W&&y>=0&&y<MAP_H) this.drawTile(x,y);
      }
    }

    // 玩家
    const ph=this.player.getHeight(this.island);
    const ps=this.toScreen(this.player.x,this.player.y,ph);
    const ppx=ps.sx+this.W/2-center.sx;
    const ppy=ps.sy+this.H/2-center.sy;
    // 阴影
    ctx.fillStyle='rgba(0,0,0,0.3)';
    ctx.beginPath();ctx.ellipse(ppx,ppy+6,8,4,0,0,Math.PI*2);ctx.fill();
    // 身体
    ctx.fillStyle='#ff8c3c';
    ctx.beginPath();ctx.arc(ppx,ppy,10,0,Math.PI*2);ctx.fill();
    ctx.strokeStyle='#fff';ctx.lineWidth=2;ctx.stroke();

    // 夜晚
    const night=Math.abs(this.dayTime-50)/50;
    if(night>0.3){ctx.fillStyle=`rgba(0,0,0,${(night-0.3)/0.7*0.6})`;ctx.fillRect(0,0,this.W,this.H);}

    // 消息
    if(this.msgTimer>0){ctx.fillStyle='rgba(0,0,0,0.75)';ctx.font='16px sans-serif';const w=ctx.measureText(this.msg).width+24;ctx.fillRect(this.W/2-w/2,this.H*0.55,w,32);ctx.fillStyle='#ffe';ctx.textAlign='center';ctx.fillText(this.msg,this.W/2,this.H*0.55+22);}
  }
  updateUI(){
    const p=this.player;
    document.getElementById('hunger-fill').style.width=p.hunger+'%';
    document.getElementById('hunger-fill').className='hunger-fill'+(p.hunger<30?' low':'');
    document.getElementById('hunger-val').textContent=Math.floor(p.hunger);
    document.getElementById('inv').textContent=`水晶${p.inv.crystal} 兽皮${p.inv.hide} 木材${p.inv.wood} 鱼${p.inv.fish}`;
    document.getElementById('sto').textContent=`水晶${p.storage.crystal} 兽皮${p.storage.hide} 木材${p.storage.wood} 鱼${p.storage.fish}`;
    const icon=document.getElementById('dn-icon'),label=document.getElementById('dn-label');
    if(this.dayTime<50){icon.textContent='☀';icon.style.left=(this.dayTime/50*50)+'%';label.textContent='白天';}
    else{icon.textContent='🌙';icon.style.left=(50+(this.dayTime-50)/50*50)+'%';label.textContent='黑夜';}
  }
  loop(now){
    const dt=Math.min(0.05,(now-this.lastTime)/1000);
    this.lastTime=now;
    this.update(dt);
    this.draw();
    requestAnimationFrame(t=>this.loop(t));
  }
}
new Game();
</script>
