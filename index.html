<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>浮岛记 (Float) - 狩猎</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { width: 100%; height: 100%; overflow: hidden; background: #0a0c12; color: #e6e6e6; font-family: -apple-system, "PingFang SC", sans-serif; touch-action: none; user-select: none; }
  #game { display: block; width: 100vw; height: 100vh; }
  #ui-top { position: fixed; top: env(safe-area-inset-top, 0); left: 0; right: 0; padding: 5px 8px; background: rgba(15,18,24,0.85); font-size: 11px; display: flex; flex-wrap: wrap; gap: 4px 10px; align-items: center; pointer-events: none; }
  .bar-wrap { display: flex; align-items: center; gap: 3px; }
  .bar { width: 60px; height: 9px; background: #2a2a2a; border-radius: 4px; overflow: hidden; }
  .fill { height: 100%; transition: width .15s; }
  .stam-fill { background: #4ac8e0; }
  .hunger-fill { background: #e0a028; } .hunger-fill.low { background: #c83828; }
  .stat { white-space: nowrap; }
  .hint { position: fixed; top: calc(env(safe-area-inset-top, 0) + 76px); left: 8px; font-size: 9px; color: #888; pointer-events: none; max-width: 72vw; }
  #daynight-bar { position: fixed; top: calc(env(safe-area-inset-top, 0) + 42px); left: 8px; width: 140px; height: 14px; border-radius: 7px; overflow: hidden; display: flex; background: #222; pointer-events: none; }
  .dn-day { flex: 1; background: linear-gradient(90deg, #4a90c2, #f5d76e); }
  .dn-night { flex: 1; background: linear-gradient(90deg, #2c3e6b, #1a1a3e); }
  .dn-icon { position: absolute; top: 0; height: 14px; line-height: 14px; font-size: 11px; transform: translateX(-50%); transition: left 0.3s; }
  .dn-label { position: absolute; top: 0; left: 50%; transform: translateX(-50%); height: 14px; line-height: 14px; font-size: 9px; color: #fff; text-shadow: 0 0 3px #000; }
  #joystick { position: fixed; left: 20px; bottom: calc(30px + env(safe-area-inset-bottom, 0)); width: 90px; height: 90px; border-radius: 50%; background: rgba(255,255,255,0.08); border: 2px solid rgba(255,255,255,0.2); touch-action: none; }
  #stick { position: absolute; left: 50%; top: 50%; transform: translate(-50%,-50%); width: 40px; height: 40px; border-radius: 50%; background: rgba(255,140,60,0.7); border: 2px solid rgba(255,255,255,0.4); }
  .btn { position: fixed; width: 50px; height: 50px; border-radius: 50%; font-size: 10px; font-weight: bold; display: flex; align-items: center; justify-content: center; touch-action: none; }
  .btn:active { filter: brightness(1.3); }
  #btn-throw { right: 20px; bottom: calc(250px + env(safe-area-inset-bottom, 0)); background: rgba(90,70,30,0.85); border: 2px solid rgba(220,180,80,0.6); color: #fff0c8; }
  #btn-melee { right: 78px; bottom: calc(310px + env(safe-area-inset-bottom, 0)); background: rgba(100,50,30,0.85); border: 2px solid rgba(220,120,60,0.6); color: #ffd8c0; }
  #btn-trap { right: 78px; bottom: calc(250px + env(safe-area-inset-bottom, 0)); background: rgba(50,80,40,0.85); border: 2px solid rgba(120,200,100,0.5); color: #d0ffd0; }
  #btn-tranq { right: 136px; bottom: calc(250px + env(safe-area-inset-bottom, 0)); background: rgba(80,40,80,0.85); border: 2px solid rgba(200,120,220,0.5); color: #f0d0ff; }
  #btn-whistle { right: 194px; bottom: calc(310px + env(safe-area-inset-bottom, 0)); background: rgba(60,60,40,0.85); border: 2px solid rgba(220,220,120,0.5); color: #ffffd0; }
  #btn-sneak { right: 20px; bottom: calc(310px + env(safe-area-inset-bottom, 0)); background: rgba(40,60,80,0.85); border: 2px solid rgba(100,160,220,0.5); color: #c0e0ff; }
  #btn-jump { right: 78px; bottom: calc(190px + env(safe-area-inset-bottom, 0)); background: rgba(60,50,90,0.85); border: 2px solid rgba(180,150,255,0.5); color: #e0d8ff; }
  #btn-fire { right: 136px; bottom: calc(190px + env(safe-area-inset-bottom, 0)); background: rgba(120,50,20,0.85); border: 2px solid rgba(255,140,40,0.6); color: #ffd0a0; }
  #btn-fish { right: 78px; bottom: calc(130px + env(safe-area-inset-bottom, 0)); background: rgba(30,60,90,0.85); border: 2px solid rgba(100,180,255,0.5); color: #c8e8ff; }
  #btn-drink { right: 136px; bottom: calc(130px + env(safe-area-inset-bottom, 0)); background: rgba(30,80,120,0.85); border: 2px solid rgba(80,180,255,0.5); color: #d0e8ff; }
  #btn-collect { right: 20px; bottom: calc(190px + env(safe-area-inset-bottom, 0)); background: rgba(40,90,60,0.85); border: 2px solid rgba(120,220,160,0.5); color: #eafff0; }
  #btn-deposit { right: 78px; bottom: calc(70px + env(safe-area-inset-bottom, 0)); background: rgba(90,40,40,0.85); border: 2px solid rgba(220,120,120,0.5); color: #ffd0d0; }
  #btn-sleep { right: 136px; bottom: calc(70px + env(safe-area-inset-bottom, 0)); background: rgba(40,40,80,0.85); border: 2px solid rgba(160,160,220,0.5); color: #d8d8ff; }
  #btn-eat { right: 20px; bottom: calc(130px + env(safe-area-inset-bottom, 0)); background: rgba(90,70,30,0.85); border: 2px solid rgba(220,180,80,0.5); color: #fff0c8; }
  #btn-craft { right: 20px; bottom: calc(70px + env(safe-area-inset-bottom, 0)); background: rgba(50,50,80,0.85); border: 2px solid rgba(150,150,220,0.5); color: #d8d8ff; }
  .btn.active { filter: brightness(1.5); box-shadow: 0 0 8px rgba(255,255,255,0.4); }
  /* PC端: 精确指针(鼠标)时隐藏触屏按钮 */
  @media (pointer: fine) {
    #joystick, .btn { display: none !important; }
    #desktop-hint { display: block !important; }
  }
  /* === PC端: 径向菜单 === */
  #player-menu { position: fixed; z-index: 200; pointer-events: none; }
  .menu-btn { position: absolute; width: 54px; height: 54px; border-radius: 50%; font-size: 11px; font-weight: bold; display: flex; align-items: center; justify-content: center; pointer-events: auto; cursor: pointer; background: rgba(40,50,70,0.92); border: 2px solid rgba(120,180,255,0.6); color: #d0e8ff; transition: filter .1s, transform .1s; }
  .menu-btn:hover { filter: brightness(1.4); transform: translate(-50%,-50%) scale(1.1); }
  .menu-btn.disabled { opacity: 0.4; }
  .menu-back { position: absolute; width: 40px; height: 40px; border-radius: 50%; font-size: 16px; pointer-events: auto; cursor: pointer; background: rgba(60,30,30,0.92); border: 2px solid rgba(220,120,80,0.5); color: #ffd0c0; display: flex; align-items: center; justify-content: center; transform: translate(-50%,-50%); }
  .menu-back:hover { filter: brightness(1.4); }
  #cursor-hint { position: fixed; z-index: 150; font-size: 10px; color: #aaa; background: rgba(0,0,0,0.6); padding: 2px 6px; border-radius: 4px; pointer-events: none; white-space: nowrap; display: none; }
</style>
</head>
<body>
<canvas id="game"></canvas>
<div id="ui-top">
  <div class="bar-wrap"><span>HP</span><div class="bar"><div id="hp-fill" class="fill" style="width:100%;background:#4ade4a"></div></div><span id="hp-val">100</span></div>
  <div class="bar-wrap"><span>耐力</span><div class="bar"><div id="stam-fill" class="fill stam-fill" style="width:100%"></div></div><span id="stam-val">100</span></div>
  <div class="bar-wrap"><span>饱</span><div class="bar"><div id="hunger-fill" class="fill hunger-fill" style="width:100%"></div></div><span id="hunger-val">100</span></div>
  <div class="bar-wrap"><span>渴</span><div class="bar"><div id="thirst-fill" class="fill" style="width:100%;background:#4a90e0"></div></div><span id="thirst-val">100</span></div>
  <div class="bar-wrap"><span>温</span><div class="bar"><div id="temp-fill" class="fill" style="width:50%;background:#e08040"></div></div><span id="temp-val">50</span></div>
  <div class="stat" id="weapon-tier">石器</div>
  <div class="stat">矛<span id="spears">3</span>斧<span id="axes">1</span>陷<span id="traps">2</span>麻<span id="tranqs">0</span></div>
  <div class="stat">包:<span id="inv">皮0肉0木0晶0骨0矿0鱼0</span></div>
</div>
<div id="daynight-bar"><div class="dn-day"></div><div class="dn-night"></div><div class="dn-icon" id="dn-icon">☀</div><div class="dn-label" id="dn-label">白天</div></div>
<div id="wind-indicator" style="position:fixed;top:calc(env(safe-area-inset-top,0)+42px);right:64px;font-size:16px;color:#88ccff;pointer-events:none;">➤</div>
<div id="weather-indicator" style="position:fixed;top:calc(env(safe-area-inset-top,0)+42px);right:8px;font-size:16px;pointer-events:none;">☀</div>
<div id="posture-indicator" style="position:fixed;top:calc(env(safe-area-inset-top,0)+60px);right:8px;font-size:11px;color:#c0e0ff;pointer-events:none;">行走</div>
<div class="hint" id="desktop-hint" style="display:none;">单击转向 · 右键投矛 · 双击近战/采集/捕鱼 · 点角色菜单 · Shift潜行 · Space跳 · M骨哨</div>
<div id="cursor-hint"></div>
<div class="hint">瞄准线锁定部位 · 头×3 心×2 前腿僵直 · 陷阱减速 · 潜行 · 狼群围猎</div>
<div id="joystick"><div id="stick"></div></div>
<div class="btn" id="btn-sneak">潜行</div>
<div class="btn" id="btn-melee">近战</div>
<div class="btn" id="btn-trap">陷阱</div>
<div class="btn" id="btn-tranq">麻醉</div>
<div class="btn" id="btn-whistle">骨哨</div>
<div class="btn" id="btn-throw">投矛</div>
<div class="btn" id="btn-jump">跳</div>
<div class="btn" id="btn-fire">火堆</div>
<div class="btn" id="btn-collect">采集</div>
<div class="btn" id="btn-fish">捕鱼</div>
<div class="btn" id="btn-drink">喝水</div>
<div class="btn" id="btn-eat">进食</div>
<div class="btn" id="btn-deposit">存仓</div>
<div class="btn" id="btn-sleep">睡觉</div>
<div class="btn" id="btn-craft">制作</div>

<script>
// ========== 配置 ==========
const TW=64,TH=32,ELEV=8,MAP_W=48,MAP_H=48;
const VISION_NEAR=7,VISION_FAR=11;
const WATER=0,GRASS=1,SAND=2,ROCK=3,TREE=4,HOME=5;
const DAY_SPEED=100/600/60,HUNGER_RATE=100/4200/60;
// 口渴: 下降快于饥饿, 水边喝水恢复; 口渴低时耐力恢复减半, 归零掉血
const THIRST_RATE=100/3000/60,THIRST_REGEN_WATER=30;
// 体温: 50舒适, 夜晚下降白天回升, 火堆旁快速回升; <30冻伤掉血, >80脱水口渴加倍
const TEMP_RATE_NIGHT=2.5/60,TEMP_RATE_DAY=1.5/60,TEMP_FIRE_BOOST=8/60;
const TEMP_COMFORT=50,TEMP_COLD=30,TEMP_HOT=80;
const MOVE_SPEED=3.2,SNEAK_SPEED=1.4;
const PLAYER_MAX_HP=100,PLAYER_MAX_STAM=100;
const STAM_REGEN=7,STAM_MOVE_DRAIN=0.4;
const TURN_SPEED=8;
// 武器等级 (伤害类型: spear=刺pierce, axe=斩cut; 骨器以上矛可淬毒)
const WEAPONS={
  stone:{name:'石器',spearDmg:22,axeDmg:18,throwStam:22,meleeStam:8,color:'#c8a040',spearType:'pierce',axeType:'cut'},
  bone:{name:'骨器',spearDmg:35,axeDmg:28,throwStam:20,meleeStam:7,color:'#e8d8c0',spearType:'pierce',axeType:'cut',poison:true},
  metal:{name:'金属',spearDmg:55,axeDmg:45,throwStam:18,meleeStam:6,color:'#c0c0d8',spearType:'pierce',axeType:'cut',poison:true},
};
const SPEAR_SPEED=9,SPEAR_RANGE=7;
const MELEE_RANGE=1.8,MELEE_CD=0.6,MELEE_ARC=Math.PI/3;
const HEAD_OFFSET=0.4,HEAD_RADIUS=0.35,BODY_RADIUS=0.7;
// 部位系统: 5个部位, 各有基础倍率/对武器类型吸收率/部位HP/效果/掉落(参考怪猎肉质)
// cutRate=斩(斧), pierceRate=刺(矛), bluntRate=钝(锤); 吸收率越高该武器打该部位越痛
// partHp: 部位独立耐久, 归零触发"破坏"产生永久效果
// === 子系统A: 部位系统 ===
// severOnly: 仅限斩击(斧)才能破坏部位(怪猎尾部设定);  breakDrop: 破坏时即时掉地上的稀有素材
const PART_DEFS=[
  {key:'head',     label:'头',   offF: 0.40, offP: 0.00, r:0.30, mult:3,   bleed:0.4, drop:{bone:2},         color:'#ff4040', cutRate:0.7, pierceRate:1.0, bluntRate:0.5, partHp:30, breakDrop:{bone:2}, breakEffect:'stunResist'},
  {key:'heart',    label:'心',   offF: 0.05, offP: 0.00, r:0.22, mult:2,   bleed:0.7, drop:{meat:2},         color:'#ff8030', cutRate:0.8, pierceRate:1.0, bluntRate:0.3, partHp:50, breakDrop:{meat:3}, breakEffect:'bigBleed'},
  {key:'frontLeg', label:'前腿', offF: 0.20, offP: 0.20, r:0.20, mult:1.5, bleed:0.2, stun:1.5, drop:{hide:1}, color:'#ffd030', cutRate:0.6, pierceRate:0.7, bluntRate:1.0, partHp:18, breakDrop:{hide:2}, breakEffect:'slow30'},
  {key:'abdomen',  label:'腹',   offF:-0.15, offP: 0.00, r:0.30, mult:1,   bleed:0.25,drop:{meat:3},         color:'#80ff60', cutRate:1.0, pierceRate:0.9, bluntRate:0.6, partHp:25, breakDrop:{meat:2}, breakEffect:'bleedDouble'},
  {key:'hindLeg',  label:'后腿', offF:-0.30, offP: 0.18, r:0.20, mult:1,   bleed:0.2, slow:4, drop:{hide:1},  color:'#60a0ff', cutRate:0.6, pierceRate:0.7, bluntRate:1.0, partHp:18, breakDrop:{hide:2}, breakEffect:'slow50'},
  {key:'tail',     label:'尾',   offF:-0.48, offP: 0.00, r:0.18, mult:1,   bleed:0.1, drop:{bone:1},         color:'#a060ff', cutRate:1.0, pierceRate:0.3, bluntRate:0.2, partHp:20, severOnly:true, breakDrop:{bone:3}, breakEffect:'slow50'},
];
// 动物
const DEER_HP=55,DEER_SPEED=4.6,WOLF_HP=85,WOLF_SPEED=4.0;
const WOLF_DMG=12,WOLF_ATK_CD=1.2;
const DEER_ALERT=10,DEER_FLEE=6;
const WOLF_ALERT=8,WOLF_CHASE=2;
const GRAZE_SPEED=0.35,BLEED_RATE=2.8,BLEED_HEAL=0.4;
const WOLF_HOWL_RANGE=14,WOLF_HOWL_CD=4;
// 狼攻击蓄势: 进入chase后需累积WOLF_ATTACK_WINDUP秒才真正扑咬
// 避免狼群一接触玩家就瞬间攻击, 给玩家反应/逃跑/反杀时间
const WOLF_ATTACK_WINDUP=1.5;
// 群体判定: 攻击范围内狼群>=WOLF_PACK_MIN只才主动攻击, 少于此数仅威慑跟随
// 击杀/打退其中一只(死亡或重伤逃跑), 其余狼立即flee
// WOLF_PACK_FLEE_RADIUS限定"玩家附近的狼群", 防止远处狼也凑数一路追过来
const WOLF_PACK_MIN=3,WOLF_PACK_FLEE_RADIUS=6;
// 单狼被玩家逼近此距离立即反击(攻击性动物本能, 不被动挨打)
const WOLF_MELEE_COUNTER=1.5;
// 砍树: 每次斧砍削减1点obsHeight, 归零时倒下按原高度给木材
const CHOP_RANGE=1.6,WOOD_PER_HGT=1;
// 陷阱
const TRAP_SLOW_DUR=6,TRAP_SLOW_MULT=0.25;
// 火堆: 木3+石2制作, 燃烧120秒, 3格内保暖+夜视+夜晚驱狼
const FIRE_BURN_TIME=120,FIRE_RADIUS=3,FIRE_WOOD_EXTEND=30;
// 潜行: 动物感知范围倍率
const SNEAK_DETECT_MULT=0.35;
// 风向: 每60秒变化, 影响动物嗅觉(玩家下风位时嗅觉正常, 上风位时嗅觉归零)
const WIND_CHANGE_INTERVAL=60;
// 噪音: 玩家移动产生噪音影响动物听觉(奔跑1.0/走0.3/潜行0.05/静止0)
const NOISE_RUN=1.0,NOISE_WALK=0.3,NOISE_SNEAK=0.05;
// 动物听觉基础范围(格)
const DEER_HEARING=8,WOLF_HEARING=10;
// 痕迹: 足迹30秒消失, 血迹跟随受伤动物
const TRACK_LIFETIME=30;
// === 子系统A/B 新增配置 ===
// 疲劳: 流血>0.5 或 HP<35% 进入, 移速/感知下降, 易中陷阱
const FATIGUE_BLEED=0.5,FATIGUE_HP=0.35,FATIGUE_SPEED=0.7,FATIGUE_SENSE=0.6;
// 愤怒: 连续被命中>=3次 或 HP<60% 进入, 移速/攻速上升, 头部吸收率下降
const ENRAGE_HIT_STREAK=3,ENRAGE_HP=0.6,ENRAGE_SPEED=1.2,ENRAGE_ATK=0.7,ENRAGE_HEAD_RATE=0.6;
// 姿态三档: walk/crouch/prone (荒野的呼唤)
const POSTURES={walk:{speed:3.2,noise:0.3,canAttack:true}, crouch:{speed:2.0,noise:0.15,canAttack:true}, prone:{speed:0.8,noise:0.05,canAttack:false}};
// 角度命中修正: 动物侧身(玩家朝向与动物朝向夹角70~110度)伤害x1.2
const ANGLE_BONUS_MIN=70*Math.PI/180,ANGLE_BONUS_MAX=110*Math.PI/180,ANGLE_BONUS_MULT=1.2;
// 破坏掉落物上限(掉地上的拾取物)
const MAX_PICKUPS=40;
// === 子系统B: 气味/粪便/NeedZones ===
// B1 气味云: 玩家每 SCENT_INTERVAL 秒在身后生成一块气味, 随风漂移 SCENT_DRIFT 格, SCENT_LIFE 秒消散
const SCENT_INTERVAL=1.0,SCENT_DRIFT=4.0,SCENT_LIFE=10,SCENT_RADIUS=1.2,MAX_SCENTS=24;
// 动物嗅觉: 动物在气味云范围内才闻到玩家(替代纯距离判定)
const SMELL_CLOUD_MULT=1.0;
// B2 粪便: 动物每 DROPPING_INTERVAL 秒留一个, DROPPING_LIFE 秒消散, 带年龄信息
const DROPPING_INTERVAL=15,DROPPING_LIFE=120,MAX_DROPPINGS=30;
// B3 Need Zones: 动物按昼夜去饮水/进食/休息区
const NZ_DRINK_RANGE={min:0,max:25},NZ_EAT_RANGE={min:25,max:50},NZ_REST_RANGE={min:75,max:100};
// 黄昏也饮水 50~75
const NZ_DRINK2_RANGE={min:50,max:75};
// === 第3批: 狩猎压力/物种叫声/体温联动 ===
// B5 狩猎压力: 击杀在压力图上累加, 压力高的区域动物生成率下降/远离
const PRESSURE_RADIUS=5,PRESSURE_DECAY=60,MAX_PRESSURE=10;
// B6 物种特异叫声: deerCall 吸引鹿, wolfCall 吸引狼(高风险)
const CALL_RADIUS=12,CALL_LURE_T=8;
// C1 体温战斗联动: 低温降近战伤害+耐力恢复, 高温降耐力上限
const COLD_TEMP=30,HOT_TEMP=80,COLD_DMG_MULT=0.8,COLD_STAM_REGEN=0.7,HOT_STAM_MAX=0.8;
// === 第4批: 驯服系统 ===
// D1 眩晕值: 麻醉球/钝击累积, 满100晕倒
const TORPOR_MAX=100,TORPOR_PER_TRANQ=40,TORPOR_DECAY=2;
// D2/D3 驯服: 进度满100驯服, 对的食物涨有效性, 错的降
const TAME_MAX=100,TAME_FOOD_RIGHT=25,TAME_FOOD_WRONG=10,TAME_EFF_DECAY=0.008;
// D4 驯服后: 鹿=驮兽, 狼=猎犬
const TAME_ROLE={deer:'pack',wolf:'hound'};
// === 第5批: 天气/小地图/生态 ===
// E1 天气: clear/rain/fog, 每 WEATHER_MIN~WEATHER_MAX 秒切换
const WEATHER_MIN=120,WEATHER_MAX=300,RAIN_VIS=-2,FOG_VIS=-3;
// E3 生态: 食肉动物攻击食草动物, 进食回血
const PREDATOR_CHASE_R=5,PREDATOR_ATTACK_DMG=15,EAT_HEAL=20;

function lerpColor(c1,c2,t){const r1=parseInt(c1.slice(1,3),16),g1=parseInt(c1.slice(3,5),16),b1=parseInt(c1.slice(5,7),16),r2=parseInt(c2.slice(1,3),16),g2=parseInt(c2.slice(3,5),16),b2=parseInt(c2.slice(5,7),16);return `rgb(${Math.round(r1+(r2-r1)*t)},${Math.round(g1+(g2-g1)*t)},${Math.round(b1+(b2-b1)*t)})`;}
function makeNoise(seed){const rand=mulberry32(seed);const grid={};const get=(x,y)=>{const k=x+','+y;if(!(k in grid))grid[k]=rand();return grid[k];};const sm=t=>t*t*(3-2*t);return(x,y)=>{const x0=Math.floor(x),y0=Math.floor(y),fx=sm(x-x0),fy=sm(y-y0);const a=get(x0,y0),b=get(x0+1,y0),c=get(x0,y0+1),d=get(x0+1,y0+1);return(a*(1-fx)+b*fx)*(1-fy)+(c*(1-fx)+d*fx)*fy;};}
function mulberry32(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;};}

// ========== 岛屿 ==========
class Island{
  constructor(seed=42){
    this.rand=mulberry32(seed);
    this.tiles=Array.from({length:MAP_H},()=>Array(MAP_W).fill(WATER));
    this.elev=Array.from({length:MAP_H},()=>Array(MAP_W).fill(0));
    this.obsHeight=Array.from({length:MAP_H},()=>Array(MAP_W).fill(0));
    this.resources={};this.memory=Array.from({length:MAP_H},()=>Array(MAP_W).fill(false));
    // === 地表细化: 每格色差噪声 + 装饰物(花/水洼/灌木/碎石/草叶) ===
    this.tileNoise=Array.from({length:MAP_H},()=>Array(MAP_W).fill(0));
    this.decor={};
    // === 纹理噪声: 基于世界坐标连续, 供drawTile画子格子色斑用 ===
    this.texN1=makeNoise(this.rand()*9999);
    this.texN2=makeNoise(this.rand()*9999);
    this._generate();
  }
  _generate(){
    const cx=MAP_W/2,cy=MAP_H/2,baseR=17;
    const n1=makeNoise(this.rand()*9999),n2=makeNoise(this.rand()*9999);
    for(let y=0;y<MAP_H;y++)for(let x=0;x<MAP_W;x++){
      const dist=Math.hypot(x-cx,y-cy);const r=baseR+(n1(x*0.15,y*0.15)-0.5)*5;
      if(dist<r-2.5){this.tiles[y][x]=GRASS;this.elev[y][x]=Math.max(0,(1-dist/baseR)*3+(n1(x*0.08,y*0.08)-0.5)*2);}
      else if(dist<r){this.tiles[y][x]=SAND;const t=(r-dist)/2.5;this.elev[y][x]=Math.max(0,0.1+t*0.4+(n2(x*0.2,y*0.2)-0.5)*0.15);}
      else if(dist<r+2.5){this.tiles[y][x]=WATER;this.elev[y][x]=0;}
    }
    for(let y=0;y<MAP_H;y++)for(let x=0;x<MAP_W;x++){
      if(this.tiles[y][x]===GRASS&&this.elev[y][x]>0.5){
        const r=this.rand();
        if(r<0.06){this.tiles[y][x]=TREE;this.obsHeight[y][x]=2+Math.floor(this.rand()*2);}
        else if(r<0.08){this.tiles[y][x]=ROCK;this.obsHeight[y][x]=1+Math.floor(this.rand()*2);}
      }
    }
    // 资源生成: 先保证至少4个水晶矿点(制作矛/斧的必需品), 再随机其他资源
    let crystalCount=0;
    for(let i=0;i<200&&crystalCount<4;i++){const x=3+Math.floor(this.rand()*(MAP_W-6)),y=3+Math.floor(this.rand()*(MAP_H-6));if((this.tiles[y][x]===GRASS||this.tiles[y][x]===SAND)&&!this.resources[`${x},${y}`]){this.resources[`${x},${y}`]='crystal';crystalCount++;}}
    for(let i=0;i<14;i++){const x=3+Math.floor(this.rand()*(MAP_W-6)),y=3+Math.floor(this.rand()*(MAP_H-6));if((this.tiles[y][x]===GRASS||this.tiles[y][x]===SAND)&&!this.resources[`${x},${y}`])this.resources[`${x},${y}`]=['crystal','hide','wood'][Math.floor(this.rand()*3)];}
    // 矿石(稀有, 在岩石旁)
    for(let i=0;i<6;i++){const x=3+Math.floor(this.rand()*(MAP_W-6)),y=3+Math.floor(this.rand()*(MAP_H-6));if(this.tiles[y][x]===GRASS)this.resources[`${x},${y}`]='ore';}
    // === 地表细化: 噪声色差 + 花丛/水洼/灌木/碎石/草叶/倒木/蘑菇/睡莲 ===
    const n3=makeNoise(this.rand()*9999),n4=makeNoise(this.rand()*9999);
    const n5=makeNoise(this.rand()*9999); // 沙地纹理噪声
    const flowerCols=['#ff6b6b','#ffd93d','#ff8cc8','#e8e0ff','#ffb347','#c8a0ff'];
    // 水深图: 离岸越远越深
    this.waterDepth=Array.from({length:MAP_H},()=>Array(MAP_W).fill(0));
    for(let y=0;y<MAP_H;y++)for(let x=0;x<MAP_W;x++){
      if(this.tiles[y][x]===WATER){
        let minD=99;
        for(let dy=-2;dy<=2;dy++)for(let dx=-2;dx<=2;dx++){
          const nx=x+dx,ny=y+dy;
          if(nx>=0&&nx<MAP_W&&ny>=0&&ny<MAP_H&&this.tiles[ny][nx]!==WATER){
            minD=Math.min(minD,Math.hypot(dx,dy));
          }
        }
        this.waterDepth[y][x]=minD<99?minD:3;
      }
    }
    // 湿沙标记: 毗邻水的沙地
    this.wetSand={};
    for(let y=0;y<MAP_H;y++)for(let x=0;x<MAP_W;x++){
      if(this.tiles[y][x]===SAND){
        for(const[dx,dy]of[[1,0],[-1,0],[0,1],[0,-1]]){
          const nx=x+dx,ny=y+dy;
          if(nx>=0&&nx<MAP_W&&ny>=0&&ny<MAP_H&&this.tiles[ny][nx]===WATER){this.wetSand[`${x},${y}`]=true;break;}
        }
      }
    }
    for(let y=0;y<MAP_H;y++)for(let x=0;x<MAP_W;x++){
      this.tileNoise[y][x]=this.rand();
      const k=`${x},${y}`;
      if(this.tiles[y][x]===GRASS){
        const fn=n3(x*0.22,y*0.22),pn=n4(x*0.18,y*0.18);
        if(fn>0.72){
          this.decor[k]={t:'flower',c:flowerCols[Math.floor(this.rand()*flowerCols.length)],ox:(this.rand()-0.5)*0.5,oy:(this.rand()-0.5)*0.3};
        } else if(pn<0.1&&this.elev[y][x]<1.0){
          this.decor[k]={t:'puddle',s:0.3+this.rand()*0.3,rot:this.rand()*Math.PI};
        } else if(this.rand()<0.04){
          this.decor[k]={t:'mushroom',c:this.rand()<0.5?'#d04848':'#e8a040',ox:(this.rand()-0.5)*0.5,oy:(this.rand()-0.5)*0.3};
        } else if(this.rand()<0.025){
          // 倒木(横躺的枯木)
          this.decor[k]={t:'log',rot:this.rand()*Math.PI,len:8+this.rand()*6};
        } else if(this.rand()<0.05){
          this.decor[k]={t:'bush',ox:(this.rand()-0.5)*0.4,oy:(this.rand()-0.5)*0.3};
        } else if(this.rand()<0.04){
          this.decor[k]={t:'pebble',ox:(this.rand()-0.5)*0.5,oy:(this.rand()-0.5)*0.3};
        } else if(this.rand()<0.5){
          const blades=[];const n=1+Math.floor(this.rand()*3);
          for(let i=0;i<n;i++)blades.push({x:(this.rand()-0.5)*0.7,y:(this.rand()-0.5)*0.4,h:2+this.rand()*3});
          this.decor[k]={t:'grass',blades};
        }
      } else if(this.tiles[y][x]===WATER){
        // 睡莲(浅水区)
        if(this.waterDepth[y][x]<1.5&&this.rand()<0.15){
          this.decor[k]={t:'lily',s:2+this.rand()*2,ox:(this.rand()-0.5)*0.4,oy:(this.rand()-0.5)*0.4};
        }
      } else if(this.tiles[y][x]===SAND){
        // 沙地涟漪纹理
        this.decor[k]={t:'ripple',rot:n5(x*0.3,y*0.3)*Math.PI};
      }
    }
    this.home={x:Math.floor(cx),y:Math.floor(cy)};
    this.tiles[this.home.y][this.home.x]=HOME;this.obsHeight[this.home.y][this.home.x]=0;
  }
  getElevAt(x,y){if(x<0||x>=MAP_W-1||y<0||y>=MAP_H-1)return 0;const x0=Math.floor(x),y0=Math.floor(y),fx=x-x0,fy=y-y0;const e00=this.elev[y0][x0],e10=this.elev[y0][x0+1],e01=this.elev[y0+1][x0],e11=this.elev[y0+1][x0+1];return e00*(1-fx)*(1-fy)+e10*fx*(1-fy)+e01*(1-fx)*fy+e11*fx*fy;}
  walkable(x,y){const ix=Math.round(x),iy=Math.round(y);if(ix<0||ix>=MAP_W||iy<0||iy>=MAP_H)return false;const t=this.tiles[iy][ix];if(t===WATER||t===TREE)return false;if(t===ROCK)return this.obsHeight[iy][ix]<=1;return true;}
  spawnPoint(safeFrom=null,safeRadius=8){for(let i=0;i<200;i++){const x=4+Math.floor(this.rand()*(MAP_W-8)),y=4+Math.floor(this.rand()*(MAP_H-8));if(this.tiles[y][x]===GRASS&&this.elev[y][x]>0.3){if(safeFrom&&Math.hypot(x-safeFrom.x,y-safeFrom.y)<safeRadius)continue;return{x,y};}}return{x:Math.floor(MAP_W/2),y:Math.floor(MAP_H/2)};}
}

// ========== 动物 ==========
class Animal{
  constructor(x,y,type){
    this.x=x;this.y=y;this.type=type;this.state='graze';
    this.aggressive=(type==='wolf');
    this.maxHp=this.aggressive?WOLF_HP:DEER_HP;this.hp=this.maxHp;
    this.baseSpeed=this.aggressive?WOLF_SPEED:DEER_SPEED;
    this.bleed=0;this.atkCd=0;this.deadTimer=0;this.hitFlash=0;this.looted=false;
    this.facing=0;this.facingTarget=0;this.grazeT=0;this.grazeMoveT=0;this.wx=0;this.wy=0;
    this.trapSlowT=0;this.howlT=0;this.packRole='solo';
    this.stunT=0;this.partSlowT=0;this.lastHitPart=null;
    this.chaseT=0;
    // 部位独立HP与破坏状态(参考怪猎部位破坏)
    this.partHp={};this.partBroken={};
    for(const d of PART_DEFS){this.partHp[d.key]=d.partHp;this.partBroken[d.key]=false;}
    // 破坏后的永久效果
    this.permSlow=0;this.bleedDouble=false;this.stunResist=false;
    // 毒(持续掉血且期间不回血) / 睡眠(陷阱+麻醉可捕获)
    this.poison=0;this.sleepT=0;
    // === 子系统A: 疲劳/愤怒/连续命中 ===
    this.hitStreak=0;this.hitStreakT=0;this.enraged=false;this.exhausted=false;
    // === 子系统D: 眩晕/驯服/等级/食性 ===
    this.torpor=0;this.tamed=false;this.tameProgress=0;this.tameEffectiveness=1;
    this.level=1+Math.floor(Math.random()*5); // 1~5
    this.diet=type==='wolf'?'carnivore':'herbivore';
    this.temperament=type==='wolf'?'aggressive':'passive';
    // === B2/B3: 粪便计时 + Need Zones(饮/食/休, 由 spawn 时 init) ===
    this.droppingT=DROPPING_INTERVAL*Math.random();
    this.needZones={drink:null,eat:null,rest:null};
    this.needMode='graze'; // 当前需求: drink/eat/rest/graze
    this.needTarget=null;
    this.lureT=0; // B6: 被叫声吸引计时
    this.role=null; // D4: 驯服后角色(pack驮兽/hound猎犬)
    this.eatT=0; // E3: 进食冷却
  }
  // === B3: 初始化 Need Zones(在岛屿上找水/草地/休息点) ===
  initNeedZones(island){
    // 饮水区: 找最近的沙滩(邻水)
    this.needZones.drink=this._findTile(island,SAND,1,true);
    // 进食区: 草地
    this.needZones.eat=this._findTile(island,GRASS,1,false);
    // 休息区: 任意草地(远离水)
    this.needZones.rest=this._findTile(island,GRASS,2,false);
  }
  _findTile(island,type,maxDist,pad){
    for(let r=0;r<20;r++){
      for(let tries=0;tries<30;tries++){
        const ang=Math.random()*Math.PI*2;
        const dist=r+Math.random()*3;
        const x=Math.round(this.x+Math.cos(ang)*dist);
        const y=Math.round(this.y+Math.sin(ang)*dist);
        if(x<1||x>=MAP_W-1||y<1||y>=MAP_H-1)continue;
        if(island.tiles[y][x]===type){
          if(pad){
            // 饮水区需邻水
            let nearWater=false;
            for(const[dx,dy]of[[1,0],[-1,0],[0,1],[0,-1]]){
              if(island.tiles[y+dy]&&island.tiles[y+dy][x+dx]===WATER){nearWater=true;break;}
            }
            if(!nearWater)continue;
          }
          return{x,y};
        }
      }
    }
    return{x:this.x,y:this.y};
  }
  // 部位位置数组(头/心/前腿/腹/后腿), 随朝向旋转
  parts(){
    const fx=Math.cos(this.facing),fy=Math.sin(this.facing);
    const px=-fy,py=fx;
    return PART_DEFS.map(d=>({...d,x:this.x+fx*d.offF+px*d.offP,y:this.y+fy*d.offF+py*d.offP}));
  }
  // 部位命中: 按部位倍率×武器类型吸收率/效果/掉落结算, 并扣部位HP触发破坏
  takeDmgPart(d,part,game,weaponType){
    // === A2: 睡眠第一击爆发 (怪猎) - 睡着时首次命中伤害x2(矛)/x3(斧) ===
    let sleepBonus=1;
    if(this.sleepT>0){
      sleepBonus=weaponType==='cut'?3:2;
      this.sleepT=0;
      if(game)game.showMsg(`★睡眠爆发! x${sleepBonus}`);
    }
    // === B7: 角度命中修正 - 动物侧身时伤害x1.2 ===
    let angleMult=1;
    if(game){
      const pAng=Math.atan2(game.player.y-this.y,game.player.x-this.x);
      let diff=Math.abs(pAng-this.facing);
      while(diff>Math.PI)diff=Math.PI*2-diff;
      if(diff>=ANGLE_BONUS_MIN&&diff<=ANGLE_BONUS_MAX)angleMult=ANGLE_BONUS_MULT;
    }
    // === A1: 武器类型吸收率(肉质) + 愤怒时头部吸收率下降 ===
    let rate=part[weaponType+'Rate']||0.8;
    if(this.enraged&&part.key==='head')rate*=ENRAGE_HEAD_RATE;
    const dmg=d*part.mult*rate*sleepBonus*angleMult;
    this.hp=Math.max(0,this.hp-dmg);
    // 毒武器(骨器以上矛)附加毒
    if(weaponType==='pierce'&&game&&game.player.getWeapon().poison)this.poison=Math.min(1,this.poison+0.3);
    const bleedAmt=(part.bleed||0.25)*(this.bleedDouble?2:1);
    this.bleed=Math.min(1,this.bleed+bleedAmt);
    this.hitFlash=0.3;
    if(part.stun&&!this.stunResist)this.stunT=part.stun;
    if(part.slow)this.partSlowT=part.slow;
    this.lastHitPart=part;
    // === A4: 连续命中累计(愤怒触发) ===
    this.hitStreak++;this.hitStreakT=4;
    // === A1: 部位HP扣减与破坏 - severOnly部位仅限斩击 ===
    if(!this.partBroken[part.key]){
      const canBreak=!part.severOnly||weaponType==='cut';
      if(canBreak){
        this.partHp[part.key]-=d*angleMult;
        if(this.partHp[part.key]<=0){
          this.partBroken[part.key]=true;
          // 破坏效果
          if(part.breakEffect==='slow30')this.permSlow=Math.max(this.permSlow,0.3);
          else if(part.breakEffect==='slow50')this.permSlow=Math.max(this.permSlow,0.5);
          else if(part.breakEffect==='bleedDouble')this.bleedDouble=true;
          else if(part.breakEffect==='stunResist')this.stunResist=true;
          // === A5: 破坏掉落即时掉地上(与剥取分离) ===
          if(part.breakDrop&&game){
            game.spawnPickup(this.x,this.y,part.breakDrop);
            game.showMsg(`★${part.label}破坏! 掉落稀有素材`);
          } else if(game)game.showMsg(`★${part.label}破坏!`);
        }
      }
    }
    if(this.hp<=0){
      this.state='dead';this.deadTimer=30;
      // 狼死亡触发附近同伴逃跑(被打退一只, 其余溃散)
      if(this.aggressive&&game)game.wolfPackFlee(this);
    } else if(!this.aggressive)this.state='flee';
    else this.state='chase';
  }
  curSpeed(){
    if(this.state==='graze')return this.baseSpeed*GRAZE_SPEED;
    if(this.state==='alert')return 0;
    let s=this.baseSpeed*(1-this.bleed*0.6)*(1-this.permSlow);
    // === A4: 疲劳减速 / 愤怒加速 ===
    if(this.exhausted)s*=FATIGUE_SPEED;
    if(this.enraged)s*=ENRAGE_SPEED;
    if(this.trapSlowT>0)s*=TRAP_SLOW_MULT;
    if(this.partSlowT>0)s*=0.5;
    return s;
  }
  turnTo(tx,ty,dt){this.facingTarget=Math.atan2(ty,tx);let diff=this.facingTarget-this.facing;while(diff>Math.PI)diff-=Math.PI*2;while(diff<-Math.PI)diff+=Math.PI*2;this.facing+=diff*Math.min(1,TURN_SPEED*dt);}
  // === D4: 驯服动物更新 - 驮鹿跟随, 猎犬攻击敌对动物 ===
  tamedUpdate(dt,game){
    const p=game.player,is=game.island;
    const dxp=p.x-this.x,dyp=p.y-this.y,dist=Math.hypot(dxp,dyp);
    // 猎犬: 攻击附近野生敌对动物
    if(this.role==='hound'){
      let target=null,bestD=6;
      for(const a of game.animals){
        if(a===this||a.tamed||a.state==='dead')continue;
        const dd=Math.hypot(a.x-this.x,a.y-this.y);
        if(dd<bestD){bestD=dd;target=a;}
      }
      if(target){
        const tdx=target.x-this.x,tdy=target.y-this.y,td=Math.hypot(tdx,tdy)||1;
        this.turnTo(tdx/td,tdy/td,dt);
        if(td<1.0){
          if(this.atkCd<=0){target.hp-=10;this.atkCd=1.0;target.state=target.aggressive?'chase':'flee';}
        } else {
          const sp=this.curSpeed()*dt;this.x+=tdx/td*sp;this.y+=tdy/td*sp;
        }
        if(this.atkCd>0)this.atkCd-=dt;
        return;
      }
    }
    // 跟随玩家(保持2格距离)
    if(dist>2.5){
      const len=dist||1;const tx=dxp/len,ty=dyp/len;this.turnTo(tx,ty,dt);
      const sp=this.curSpeed()*dt;
      if(is.walkable(this.x+tx*sp,this.y))this.x+=tx*sp;
      if(is.walkable(this.x,this.y+ty*sp))this.y+=ty*sp;
    } else if(dist<1.5){
      // 太近则后退一点
      const len=dist||1;const tx=-dxp/len,ty=-dyp/len;
      const sp=this.curSpeed()*0.5*dt;
      if(is.walkable(this.x+tx*sp,this.y))this.x+=tx*sp;
      if(is.walkable(this.x,this.y+ty*sp))this.y+=ty*sp;
    }
    if(this.atkCd>0)this.atkCd-=dt;
  }
  takeDmg(d,weak,game){
    this.hp=Math.max(0,this.hp-d);
    this.bleed=Math.min(1,this.bleed+(weak?0.5:0.25));
    this.hitFlash=0.3;
    this.lastHitPart=null;
    if(this.hp<=0){this.state='dead';this.deadTimer=30;if(game)game.addPressure(this.x,this.y);}
    else if(!this.aggressive){this.state='flee';}
    else{this.state='chase';}
  }
  update(dt,game){
    const p=game.player,is=game.island;
    if(this.hitFlash>0)this.hitFlash-=dt;
    if(this.state==='dead'){this.deadTimer-=dt;return;}
    // === D1: 眩晕值衰减 ===
    if(this.torpor>0)this.torpor=Math.max(0,this.torpor-TORPOR_DECAY*dt);
    // === D3: 驯服有效性衰减(未驯服且进度>0时) ===
    if(!this.tamed&&this.tameProgress>0)this.tameEffectiveness=Math.max(0.3,this.tameEffectiveness-TAME_EFF_DECAY*dt);
    // === D4: 驯服动物行为 - 跟随玩家, 猎犬攻击敌对动物 ===
    if(this.tamed){
      this.tamedUpdate(dt,game);
      return;
    }
    if(this.trapSlowT>0)this.trapSlowT-=dt;
    // 毒: 持续掉血, 中毒期间不回血(流血继续)
    if(this.poison>0){this.hp=Math.max(0,this.hp-this.poison*3*dt);this.poison=Math.max(0,this.poison-0.05*dt);if(this.hp<=0){this.state='dead';this.deadTimer=30;return;}}
    // 睡眠: 完全静止(陷阱+麻醉可捕获), 期间其他状态继续结算
    if(this.sleepT>0){this.sleepT-=dt;if(this.sleepT>0)return;}
    if(this.bleed>0){this.hp=Math.max(0,this.hp-this.bleed*BLEED_RATE*dt);this.bleed=Math.max(0,this.bleed-BLEED_HEAL*dt);if(this.hp<=0){this.state='dead';this.deadTimer=30;return;}}
    // 部位僵直: 不AI/移动, 但流血继续
    if(this.stunT>0){this.stunT-=dt;if(this.stunT>0)return;}
    if(this.partSlowT>0)this.partSlowT-=dt;
    // === A4: 连击计时衰减 + 疲劳/愤怒判定 ===
    if(this.hitStreakT>0){this.hitStreakT-=dt;if(this.hitStreakT<=0)this.hitStreak=0;}
    this.exhausted=this.bleed>FATIGUE_BLEED||this.hp<this.maxHp*FATIGUE_HP;
    // 愤怒: 连击>=3 或 HP<60%, 但疲劳时不愤怒
    this.enraged=!this.exhausted&&(this.hitStreak>=ENRAGE_HIT_STREAK||this.hp<this.maxHp*ENRAGE_HP);
    // 潜行影响感知距离 + 疲劳感知下降
    // === B4: 姿态决定被发现难度(卧倒最难) ===
    const senseMult={walk:1,crouch:0.6,prone:SNEAK_DETECT_MULT}[game.player.posture]||1;
    let mult=senseMult;
    if(this.exhausted)mult*=FATIGUE_SENSE;
    const distP=Math.hypot(p.x-this.x,p.y-this.y);
    const dxp=p.x-this.x,dyp=p.y-this.y;
    // 听觉: 玩家噪音越大, 动物听得越远
    const hearR=(this.aggressive?WOLF_HEARING:DEER_HEARING)*p.noise*mult;
    // === B1: 嗅觉改为气味云判定 - 动物在玩家气味云范围内才闻到 ===
    let smellR=0;
    for(const sc of game.scents){
      const sd=Math.hypot(sc.x-this.x,sc.y-this.y);
      if(sd<SCENT_RADIUS+0.5){smellR=Math.max(smellR,(this.aggressive?14:12)*mult*SMELL_CLOUD_MULT);break;}
    }
    // 综合感知范围 = max(视觉, 听觉, 嗅觉)
    const alertR=Math.max((this.aggressive?WOLF_ALERT:DEER_ALERT)*mult, hearR, smellR);
    const actR=(this.aggressive?WOLF_CHASE:DEER_FLEE)*mult;

    if(this.aggressive){
      if(this.hp<this.maxHp*0.25){this.state='flee';}
      else if(distP<WOLF_MELEE_COUNTER){
        // 单狼被玩家逼近到近身距离, 立即反击(攻击性动物本能, 不逃跑)
        this.state='chase';this.chaseT=Math.max(this.chaseT,WOLF_ATTACK_WINDUP);
      }
      else if(distP<actR){
        // 群体判定: 玩家附近WOLF_PACK_FLEE_RADIUS内狼>=WOLF_PACK_MIN才主动chase, 否则仅alert威慑
        // 注意是"玩家附近"的狼数, 不是"自己附近", 防止远处大群一路追过来
        const packNearPlayer=game.animals.filter(w=>w.type==='wolf'&&w.state!=='dead'&&Math.hypot(w.x-p.x,w.y-p.y)<WOLF_PACK_FLEE_RADIUS).length;
        if(packNearPlayer>=WOLF_PACK_MIN)this.state='chase';
        // 已chase但狼群溃散(掉到<3), 立即降级到alert, 不再死缠
        else if(this.state==='chase'){this.state='alert';this.chaseT=0;}
        else if(this.state!=='attack')this.state='alert';
      }
      else if(distP<alertR){this.state='alert';}
      else if(this.state!=='flee'){this.state='graze';}
      // 蓄势计时: chase状态累积, 离开/中断则归零
      if(this.state==='chase'){this.chaseT+=dt;}
      else if(this.state!=='attack'){this.chaseT=0;}
      // 嗥叫呼叫同伴(只在自己确实在chase时, 且玩家附近已凑够3只)
      if(this.state==='chase'){
        this.howlT-=dt;
        if(this.howlT<=0){this.howlT=WOLF_HOWL_CD;game.wolfHowl(this);}
      }
      // 群体轮攻: packRole由game分配, 只有attacker才攻击
      // 蓄势满(WOLF_ATTACK_WINDUP秒)后才真正扑咬, 否则只是威慑跟随
      // 夜晚怕火: 玩家在火堆范围内时狼不敢扑咬
      const isNight=game.dayTime>=50;
      const playerNearFire=isNight&&nearFire(game,p.x,p.y);
      if(this.state==='chase'&&distP<1.4&&this.chaseT>=WOLF_ATTACK_WINDUP&&!playerNearFire){
        if(this.packRole==='attacker'||this.packRole==='solo'){
          this.state='attack';
          if(this.atkCd<=0){p.hp=Math.max(0,p.hp-WOLF_DMG);p.invuln=0.5;this.atkCd=WOLF_ATK_CD*(this.enraged?ENRAGE_ATK:1);game.showMsg((this.enraged?'【怒】':'')+'被狼咬伤! -'+WOLF_DMG);game.playSound('hurt');}
        } else {
          // 包围者: 绕到玩家侧后方
          const flankAng=Math.atan2(dyp,dxp)+(this.packId%2?1:-1)*1.5;
          this.turnTo(Math.cos(flankAng),Math.sin(flankAng),dt);
        }
      }
      if(this.state==='attack'&&distP>2.0)this.state='chase';
    } else {
      if(distP<actR){this.state='flee';}
      else if(distP<alertR){this.state='alert';}
      else if(this.state!=='flee'){this.state='graze';}
      else if(distP>alertR+2){this.state='graze';}
    }
    if(this.atkCd>0)this.atkCd-=dt;

    let tx=0,ty=0;
    if(this.state==='flee'){tx=-dxp;ty=-dyp;const len=Math.hypot(tx,ty)||1;tx/=len;ty/=len;this.turnTo(tx,ty,dt);}
    else if(this.state==='chase'){tx=dxp;ty=dyp;const len=Math.hypot(tx,ty)||1;tx/=len;ty/=len;this.turnTo(tx,ty,dt);}
    else if(this.state==='alert'){this.turnTo(dxp,dyp,dt);}
    else{
      // === B6: 被叫声吸引(lureT>0)时优先朝玩家移动 ===
      if(this.lureT>0){
        this.lureT-=dt;
        const len=Math.hypot(dxp,dyp)||1;tx=dxp/len;ty=dyp/len;this.turnTo(tx,ty,dt);
      } else {
      // === E3: 食肉动物捕猎食草动物 + 尸体进食回血 ===
      let didHunt=false;
      if(this.diet==='carnivore'){
        // 1) 找附近尸体(鹿)进食
        let corpse=null,corpseD=Infinity;
        for(const a of game.animals){
          if(a.state==='dead'&&a.type==='deer'){
            const d=Math.hypot(a.x-this.x,a.y-this.y);
            if(d<corpseD){corpseD=d;corpse=a;}
          }
        }
        if(corpse&&corpseD<10){
          const cdx=corpse.x-this.x,cdy=corpse.y-this.y,cLen=Math.hypot(cdx,cdy)||1;
          if(cLen>0.8){tx=cdx/cLen;ty=cdy/cLen;this.turnTo(tx,ty,dt);this.state='chase';}
          else{
            this.eatT-=dt;
            if(this.eatT<=0){this.eatT=1.2;this.hp=Math.min(this.maxHp,this.hp+EAT_HEAL);corpse.deadTimer-=6;}
            tx=0;ty=0;this.state='graze';
          }
          didHunt=true;
        } else {
          // 2) 找附近鹿捕猎
          let prey=null,preyD=PREDATOR_CHASE_R;
          for(const a of game.animals){
            if(a.type==='deer'&&a.state!=='dead'){
              const d=Math.hypot(a.x-this.x,a.y-this.y);
              if(d<preyD){preyD=d;prey=a;}
            }
          }
          if(prey){
            const pdx=prey.x-this.x,pdy=prey.y-this.y,pLen=Math.hypot(pdx,pdy)||1;
            tx=pdx/pLen;ty=pdy/pLen;this.turnTo(tx,ty,dt);this.state='chase';
            if(pLen<1.0&&this.atkCd<=0){
              prey.takeDmg(PREDATOR_ATTACK_DMG,false,game);prey.state='flee';this.atkCd=1.0;
            }
            didHunt=true;
          }
        }
      }
      if(!didHunt){
      // === B3: Need Zones 行为调度(仅 graze 状态) ===
      const dt2=game.dayTime;
      let targetMode='graze';
      if((dt2>=NZ_DRINK_RANGE.min&&dt2<NZ_DRINK_RANGE.max)||(dt2>=NZ_DRINK2_RANGE.min&&dt2<NZ_DRINK2_RANGE.max))targetMode='drink';
      else if(dt2>=NZ_EAT_RANGE.min&&dt2<NZ_EAT_RANGE.max)targetMode='eat';
      else if(dt2>=NZ_REST_RANGE.min&&dt2<NZ_REST_RANGE.max)targetMode='rest';
      this.needMode=targetMode;
      const zone=this.needZones[targetMode];
      if(zone&&Math.hypot(zone.x-this.x,zone.y-this.y)>1.2){
        // 前往需求区
        const ddx=zone.x-this.x,ddy=zone.y-this.y;const len=Math.hypot(ddx,ddy)||1;tx=ddx/len;ty=ddy/len;this.turnTo(tx,ty,dt);
      } else {
        // 已在需求区附近: 休息=不动, 食/饮=小幅漫游
        if(targetMode==='rest'){tx=0;ty=0;}
        else{
          this.grazeT-=dt;
          if(this.grazeT<=0){this.grazeT=3+Math.random()*4;const a=Math.random()*Math.PI*2;this.wx=Math.cos(a);this.wy=Math.sin(a);this.grazeMoveT=1+Math.random()*1.5;}
          if(this.grazeMoveT>0){this.grazeMoveT-=dt;tx=this.wx;ty=this.wy;this.turnTo(tx,ty,dt);}
        }
      }
      } // close didHunt
      } // close lureT else
    }
    const sp=this.curSpeed()*dt;
    if(tx||ty){const nx=this.x+tx*sp,ny=this.y+ty*sp;if(is.walkable(nx,this.y))this.x=nx;if(is.walkable(this.x,ny))this.y=ny;}
    // 陷阱检测
    for(const tp of game.traps){if(!tp.triggered&&Math.hypot(tp.x-this.x,tp.y-this.y)<0.6){tp.triggered=true;tp.triggerT=TRAP_SLOW_DUR;this.trapSlowT=TRAP_SLOW_DUR;game.showMsg('动物踩中陷阱!');}}
    this.x=Math.max(1,Math.min(MAP_W-2,this.x));this.y=Math.max(1,Math.min(MAP_H-2,this.y));
    // === B2: 留粪便(带年龄信息) ===
    this.droppingT-=dt;
    if(this.droppingT<=0){
      this.droppingT=DROPPING_INTERVAL;
      if(game.droppings.length<MAX_DROPPINGS)game.droppings.push({x:this.x,y:this.y,type:this.type,age:0});
    }
  }
}

// ========== 陷阱 ==========
class Trap{constructor(x,y){this.x=x;this.y=y;this.triggered=false;this.triggerT=0;this.dead=false;}}
// ========== 火堆 ==========
class Fire{constructor(x,y){this.x=x;this.y=y;this.burnT=FIRE_BURN_TIME;this.dead=false;}}
// 附近是否有燃烧的火堆(用于保暖/夜视/驱狼)
function nearFire(g,x,y,radius=FIRE_RADIUS){for(const f of g.fires)if(f.burnT>0&&Math.hypot(f.x-x,f.y-y)<radius)return f;return null;}

// ========== 矛 ==========
class Spear{
  constructor(x,y,dx,dy,dmg,tierColor,weaponType){this.x=x;this.y=y;this.dx=dx;this.dy=dy;this.dmg=dmg;this.color=tierColor;this.type=weaponType;this.life=SPEAR_RANGE;this.dead=false;this.hitSet=new Set();}
  update(dt,game){
    const sp=SPEAR_SPEED*dt;this.x+=this.dx*sp;this.y+=this.dy*sp;this.life-=sp;
    if(this.life<=0||!game.island.walkable(this.x,this.y)){this.dead=true;return;}
    for(const a of game.animals){
      if(a.state==='dead'||a.tamed||this.hitSet.has(a))continue;
      // 部位命中: 找距离矛最近的部位, 在其半径内即触发
      const parts=a.parts();
      let best=null,bestD=Infinity;
      for(const p of parts){
        const d=Math.hypot(p.x-this.x,p.y-this.y);
        if(d<p.r&&d<bestD){best=p;bestD=d;}
      }
      if(best){
        a.takeDmgPart(this.dmg,best,game,this.type);this.hitSet.add(a);this.dead=true;
        game.showMsg(`${best.label}命中! x${best.mult} ${a.hp<=0?'击杀!':Math.floor(a.hp)+'/'+a.maxHp}`);return;
      }
      // 身体兜底(没瞄到任何部位但擦到身体)
      const dBody=Math.hypot(a.x-this.x,a.y-this.y);
      if(dBody<BODY_RADIUS){
        a.takeDmg(this.dmg,false,game);this.hitSet.add(a);this.dead=true;
        game.showMsg(`擦身命中 ${a.hp<=0?'击杀!':Math.floor(a.hp)+'/'+a.maxHp}`);return;
      }
    }
  }
}

// ========== 玩家 ==========
class Player{
  constructor(x,y){this.x=x;this.y=y;this.hp=PLAYER_MAX_HP;this.stamina=PLAYER_MAX_STAM;this.hunger=100;
    this.thirst=100;this.temp=TEMP_COMFORT;
    this.inv={crystal:0,hide:0,wood:0,fish:0,meat:0,bone:0,ore:0};
    this.storage={crystal:0,hide:0,wood:0,fish:0,meat:0,bone:0,ore:0};
    this.spears=3;this.axes=1;this.traps=2;this.tranqs=0;this.whistles=0;this.weaponTier='stone';
    this.faceX=0;this.faceY=1;this.facing=0;this.invuln=0;this.meleeCd=0;this.posture='walk';this.noise=0;this.callType='deer';}
  getHeight(island){return island.getElevAt(this.x,this.y);}
  getWeapon(){return WEAPONS[this.weaponTier];}
  // === B4: 姿态三档 ===
  getPosture(){return POSTURES[this.posture];}
  collect(island){const ix=Math.round(this.x),iy=Math.round(this.y);const k=`${ix},${iy}`;if(k in island.resources){const r=island.resources[k];delete island.resources[k];this.inv[r]++;return r;}return null;}
  deposit(){for(const k in this.inv){this.storage[k]+=this.inv[k];this.inv[k]=0;}}
}

// ========== 游戏 ==========
class Game{
  constructor(){
    this.canvas=document.getElementById('game');this.ctx=this.canvas.getContext('2d');
    this.resize();window.addEventListener('resize',()=>this.resize());
    this.island=new Island(Math.floor(Math.random()*9999)+1);
    this.player=new Player(this.island.home.x,this.island.home.y);
    this.camX=this.player.x;this.camY=this.player.y;
    this.dayTime=0;this.moveDX=0;this.moveDY=0;
    this.jumpQueued=false;this.throwQueued=false;this.meleeQueued=false;this.meleeAnim=0;
    this.moveTarget=null; // 双击移动目标点
    this.animals=[];this.spears_flying=[];this.traps=[];this.fires=[];this.tracks=[];this.howlEffects=[];this.pickups=[];
    // === B: 气味云 + 粪便 ===
    this.scents=[];this.droppings=[];this.scentT=0;
    // === B5: 狩猎压力图 ===
    this.pressure=Array.from({length:MAP_H},()=>Array(MAP_W).fill(0));
    this.pressureDecayT=0;
    this.windAng=0;this.windT=0;
    // === E1: 天气系统 ===
    this.weather='clear';this.weatherT=WEATHER_MIN+Math.random()*(WEATHER_MAX-WEATHER_MIN);
    // === 预渲染地形到离屏Canvas(静态层, 一次渲染每帧blit) ===
    this._off=false;
    this.terrainOffX=(MAP_H-1)*TW/2+100;
    this.terrainOffY=100;
    this.terrainCanvas=document.createElement('canvas');
    this.terrainCanvas.width=(MAP_W+MAP_H)*TW/2+200;
    this.terrainCanvas.height=(MAP_W+MAP_H)*TH/2+200;
    this.terrainCtx=this.terrainCanvas.getContext('2d');
    this.spawnAnimals(8,6);
    this.renderTerrain();
    this.msg='';this.msgTimer=0;this.lastTime=performance.now();
    this.setupInput();this.updateUI();
    // === 音效系统(WebAudio合成, 无需外部文件) ===
    this.audioCtx=null;this._audioReady=false;
    requestAnimationFrame(()=>this.loop());
  }
  spawnAnimals(deerN,wolfN){
    const home=this.island.home;
    for(let i=0;i<deerN;i++){const s=this.island.spawnPoint();const a=new Animal(s.x,s.y,'deer');a.initNeedZones(this.island);this.animals.push(a);}
    // 狼生成时避开出生点 WOLF_CHASE*3 格, 确保玩家出生时不在狼的主动攻击范围内
    const wolfSafeR=WOLF_CHASE*3;
    for(let i=0;i<wolfN;i++){const s=this.island.spawnPoint(home,wolfSafeR);const a=new Animal(s.x,s.y,'wolf');a.initNeedZones(this.island);this.animals.push(a);}
  }
  // 狼群溃逃: 一只狼被打退, 附近其余狼立即flee
  wolfPackFlee(dead){
    let fled=0;
    for(const w of this.animals){
      if(w.type==='wolf'&&w!==dead&&w.state!=='dead'&&w.state!=='flee'){
        const d=Math.hypot(w.x-dead.x,w.y-dead.y);
        if(d<WOLF_PACK_FLEE_RADIUS){w.state='flee';w.chaseT=0;fled++;}
      }
    }
    if(fled>0)this.showMsg(`狼群溃逃! ${fled}只狼逃走`);
  }
  // 狼群AI: 嗥叫呼叫附近狼
  wolfHowl(caller){
    this.howlEffects.push({x:caller.x,y:caller.y,t:1.5});
    let called=0;
    // 嗥叫前先确认玩家附近狼群>=WOLF_PACK_MIN才召集, 否则单狼独斗等于送死
    const packNearPlayer=this.animals.filter(w=>w.type==='wolf'&&w.state!=='dead'&&Math.hypot(w.x-this.player.x,w.y-this.player.y)<WOLF_PACK_FLEE_RADIUS).length;
    if(packNearPlayer<WOLF_PACK_MIN)return;
    for(const w of this.animals){
      if(w.type==='wolf'&&w!==caller&&w.state!=='dead'&&w.state!=='chase'&&w.state!=='attack'){
        const d=Math.hypot(w.x-caller.x,w.y-caller.y);
        if(d<WOLF_HOWL_RANGE){w.state='chase';w.howlT=WOLF_HOWL_CD;called++;}
      }
    }
    // 分配群体角色
    const pack=this.animals.filter(w=>w.type==='wolf'&&(w.state==='chase'||w.state==='attack'));
    if(pack.length>=3){
      pack.sort((a,b)=>Math.hypot(a.x-this.player.x,a.y-this.player.y)-Math.hypot(b.x-this.player.x,b.y-this.player.y));
      pack.forEach((w,i)=>{w.packRole=i===0?'attacker':'flank';w.packId=i;});
    } else {pack.forEach(w=>{w.packRole='solo';});}
  }
  // === A5: 破坏掉落物(掉地上, 玩家走过去捡) ===
  // === B5: 狩猎压力 - 在击杀点周围半径内累加 ===
  addPressure(x,y){
    const cx=Math.round(x),cy=Math.round(y);
    for(let dy=-PRESSURE_RADIUS;dy<=PRESSURE_RADIUS;dy++){
      for(let dx=-PRESSURE_RADIUS;dx<=PRESSURE_RADIUS;dx++){
        const px=cx+dx,py=cy+dy;
        if(px<0||px>=MAP_W||py<0||py>=MAP_H)continue;
        const dist=Math.hypot(dx,dy);
        if(dist<=PRESSURE_RADIUS){
          const add=Math.max(0,1-dist/PRESSURE_RADIUS)*2;
          this.pressure[py][px]=Math.min(MAX_PRESSURE,this.pressure[py][px]+add);
        }
      }
    }
  }
  getPressure(x,y){
    const ix=Math.round(x),iy=Math.round(y);
    if(ix<0||ix>=MAP_W||iy<0||iy>=MAP_H)return 0;
    return this.pressure[iy][ix];
  }
  spawnPickup(x,y,items){
    if(this.pickups.length>=MAX_PICKUPS)this.pickups.shift();
    // 小幅随机偏移避免重叠
    const ox=(Math.random()-0.5)*0.4,oy=(Math.random()-0.5)*0.4;
    this.pickups.push({x:x+ox,y:y+oy,items:{...items},life:120});
  }
  collectPickups(){
    const p=this.player;const names={crystal:'水晶',hide:'皮',meat:'肉',bone:'骨',ore:'矿',wood:'木',fish:'鱼'};
    for(let i=this.pickups.length-1;i>=0;i--){
      const pk=this.pickups[i];
      if(Math.hypot(pk.x-p.x,pk.y-p.y)<0.8){
        let summary=[];
        for(const k in pk.items){p.inv[k]=(p.inv[k]||0)+pk.items[k];summary.push((names[k]||k)+'+'+pk.items[k]);}
        this.showMsg('拾取 '+summary.join(' '));
        this.pickups.splice(i,1);
        this.updateUI();
      }
    }
  }
  // === B2: 玩家靠近粪便时显示新鲜度(判断动物是否还在附近) ===
  checkDroppingInfo(){
    const p=this.player;
    let nearest=null,bestD=Infinity;
    for(const d of this.droppings){
      const dd=Math.hypot(d.x-p.x,d.y-p.y);
      if(dd<1.5&&dd<bestD){bestD=dd;nearest=d;}
    }
    if(nearest){
      const a=nearest.age;
      let freshness;
      if(a<30)freshness='新鲜(<30s), 动物就在附近!';
      else if(a<120)freshness='较久(<2min), 动物刚离开';
      else freshness='很久(>2min), 动物已走远';
      const spec=nearest.type==='wolf'?'狼':'鹿';
      // 用 hint 显示而非 msg(避免刷屏), 这里复用 msg 但加节流
      if(!this._dropMsgT||this._dropMsgT<=0){this.showMsg(`${spec}粪便: ${freshness}`);this._dropMsgT=3;}
    }
    if(this._dropMsgT>0)this._dropMsgT-=1/60;
  }
  resize(){this.W=window.innerWidth;this.H=window.innerHeight;this.canvas.width=this.W*devicePixelRatio;this.canvas.height=this.H*devicePixelRatio;this.canvas.style.width=this.W+'px';this.canvas.style.height=this.H+'px';this.ctx.scale(devicePixelRatio,devicePixelRatio);}
  toScreen(x,y,elev=0){return{sx:(x-y)*TW/2,sy:(x+y)*TH/2-elev*ELEV};}
  setupInput(){
    const isTouch=false; // CSS @media (pointer:fine) 自动处理按钮显示/隐藏

    joy.addEventListener('touchstart',e=>{e.preventDefault();active=true;const r=joy.getBoundingClientRect();cx=r.left+r.width/2;cy=r.top+r.height/2;});
    joy.addEventListener('touchmove',e=>{e.preventDefault();if(!active)return;const t=e.touches[0];set(t.clientX-cx,t.clientY-cy);});
    const end=e=>{e.preventDefault();active=false;set(0,0);stick.style.transform='translate(-50%,-50%)';};
    joy.addEventListener('touchend',end);joy.addEventListener('touchcancel',end);
    const bid=(id,fn)=>document.getElementById(id).addEventListener('touchstart',e=>{e.preventDefault();fn.call(this);});
    bid('btn-jump',()=>this.jumpQueued=true);
    bid('btn-fire',()=>this.doFire());
    bid('btn-throw',()=>this.throwQueued=true);
    bid('btn-melee',()=>this.meleeQueued=true);
    bid('btn-trap',()=>this.doTrap());
    bid('btn-tranq',()=>this.doTranq());
    bid('btn-whistle',()=>this.doWhistle());
    bid('btn-sneak',()=>this.toggleSneak());
    bid('btn-fish',()=>this.doFish());
    bid('btn-drink',()=>this.doDrink());
    bid('btn-collect',()=>this.doCollect());
    bid('btn-deposit',()=>this.doDeposit());
    bid('btn-sleep',()=>this.doSleep());
    bid('btn-eat',()=>this.doEat());
    bid('btn-craft',()=>this.doCraft());
    const keys={};
    window.addEventListener('keydown',e=>{keys[e.key]=true;if(e.key===' '){this.jumpQueued=true;e.preventDefault();}if(e.key==='j')this.throwQueued=true;if(e.key==='k')this.meleeQueued=true;if(e.key==='x')this.doTrap();if(e.key==='z')this.doTranq();if(e.key==='v')this.doFire();if(e.key==='b')this.doDrink();if(e.key==='n')this.doSleep();if(e.key==='m')this.doWhistle();if(e.key==='Shift')this.toggleSneak();if(e.key==='e')this.doCollect();if(e.key==='q')this.doFish();if(e.key==='f')this.doDeposit();if(e.key==='r')this.doEat();if(e.key==='c')this.doCraft();if(e.key==='g')this.toggleCall();if(e.key==='t')this.doFeed();});
    window.addEventListener('keyup',e=>keys[e.key]=false);
    this.getKeys=()=>{let dx=0,dy=0;if(keys['ArrowUp']||keys['w'])dy-=1;if(keys['ArrowDown']||keys['s'])dy+=1;if(keys['ArrowLeft']||keys['a'])dx-=1;if(keys['ArrowRight']||keys['d'])dx+=1;return{dx,dy};};
    // === PC端: 鼠标操作 (始终启用, 不干扰触屏) ===
    this.setupMouse();
  }
  // === 屏幕坐标→世界坐标(逆等距投影) ===
  screenToWorld(sx,sy){
    const camSX=(this.camX-this.camY)*TW/2,camSY=(this.camX+this.camY)*TH/2;
    const lx=sx-this.W/2+camSX,ly=sy-this.H/2+camSY;
    return{x:lx/TW+ly/TH,y:-lx/TW+ly/TH};
  }
  // === 查找点击位置附近的实体 ===
  findAnimalAt(wx,wy){
    let best=null,bestD=1.0;
    for(const a of this.animals){
      if(a.state==='dead')continue;
      const d=Math.hypot(a.x-wx,a.y-wy);
      if(d<bestD){bestD=d;best=a;}
    }
    return best;
  }
  findCorpseAt(wx,wy){
    for(const a of this.animals){
      if(a.state!=='dead'||a.looted)continue;
      if(Math.hypot(a.x-wx,a.y-wy)<1.0)return a;
    }
    return null;
  }
  // === 鼠标事件设置 ===
  setupMouse(){
    const canvas=this.ctx.canvas;
    let clickTimer=null,lastClick={x:0,y:0,t:0};
    const curHint=document.getElementById('cursor-hint');
    canvas.addEventListener('contextmenu',e=>e.preventDefault());
    // 鼠标悬停提示
    canvas.addEventListener('mousemove',e=>{
      const rect=canvas.getBoundingClientRect();
      const sx=e.clientX-rect.left,sy=e.clientY-rect.top;
      const w=this.screenToWorld(sx,sy);
      const a=this.findAnimalAt(w.x,w.y);
      const c=this.findCorpseAt(w.x,w.y);
      const tx=Math.round(w.x),ty=Math.round(w.y);
      let tip=null;
      if(a){tip=`${a.type==='deer'?'鹿':'狼'} HP${Math.ceil(a.hp)}/${a.maxHp}${a.state==='flee'?' 逃跑':''}${a.rage?' 🔥':''}`;}
      else if(c){tip='尸体(双击采集)';}
      else if(tx>=0&&tx<MAP_W&&ty>=0&&ty<MAP_H){
        const t=this.island.tiles[ty][tx];
        if(t===WATER)tip='水面(双击捕鱼)';
        else if(t===ROCK)tip='矿石(双击采集)';
        else if(t===TREE)tip='树木';
      }
      if(tip){curHint.textContent=tip;curHint.style.display='block';curHint.style.left=(sx+14)+'px';curHint.style.top=(sy-20)+'px';}
      else curHint.style.display='none';
    });
    canvas.addEventListener('mouseleave',()=>curHint.style.display='none');
    canvas.addEventListener('mousedown',e=>{
      e.preventDefault();
      const rect=canvas.getBoundingClientRect();
      const sx=e.clientX-rect.left,sy=e.clientY-rect.top;
      if(e.button===2){
        // 右键: 投矛
        this.handleThrowAt(sx,sy);
        return;
      }
      if(e.button!==0)return;
      // 检测双击
      const now=Date.now(),dt=now-lastClick.t,dist=Math.hypot(sx-lastClick.x,sy-lastClick.y);
      if(dt<300&&dist<25){
        if(clickTimer){clearTimeout(clickTimer);clickTimer=null;}
        this.handleDoubleClick(sx,sy);
        lastClick.t=0;
      }else{
        lastClick={x:sx,y:sy,t:now};
        if(clickTimer)clearTimeout(clickTimer);
        clickTimer=setTimeout(()=>{this.handleSingleClick(sx,sy);clickTimer=null;},250);
      }
    });
  }
  // === 单击: 转向 or 点角色弹出菜单 ===
  handleSingleClick(sx,sy){
    const w=this.screenToWorld(sx,sy);
    const pd=Math.hypot(w.x-this.player.x,w.y-this.player.y);
    if(pd<0.6){
      // 点角色 → 弹出菜单
      this.showPlayerMenu();
      return;
    }
    // 转向
    const dx=w.x-this.player.x,dy=w.y-this.player.y;
    const len=Math.hypot(dx,dy)||1;
    this.player.faceX=dx/len;this.player.faceY=dy/len;
    this.player.facing=Math.atan2(dy,dx);
  }
  // === 双击: 近战/采集/捕鱼 ===
  handleDoubleClick(sx,sy){
    const w=this.screenToWorld(sx,sy);
    const a=this.findAnimalAt(w.x,w.y);
    if(a){
      // 转向猎物并近战
      const dx=a.x-this.player.x,dy=a.y-this.player.y;
      const len=Math.hypot(dx,dy)||1;
      this.player.faceX=dx/len;this.player.faceY=dy/len;
      this.player.facing=Math.atan2(dy,dx);
      this.meleeQueued=true;
      return;
    }
    const c=this.findCorpseAt(w.x,w.y);
    if(c){
      // 采集尸体
      this.doCollect();
      return;
    }
    const tx=Math.round(w.x),ty=Math.round(w.y);
    if(tx>=0&&tx<MAP_W&&ty>=0&&ty<MAP_H){
      const t=this.island.tiles[ty][tx];
      if(t===WATER){
        // 双击水面→捕鱼/喝水(根据距离)
        const pd=Math.hypot(tx-this.player.x,ty-this.player.y);
        if(pd<3)this.doFish();
        else this.showMsg('太远了, 靠近水域');
        return;
      }
      if(t===ROCK){
        // 双击矿石→采集
        this.mineRock(tx,ty);
        return;
      }
    }
    // 无活体猎物/尸体/水/矿石 → 走向目标点
    const dx=w.x-this.player.x,dy=w.y-this.player.y;
    const dist=Math.hypot(dx,dy);
    if(dist>0.5){
      this.moveTarget={x:w.x,y:w.y};
      this.showMsg('走向目标...');
    }
  }
  // === 右键: 投矛 ===
  handleThrowAt(sx,sy){
    const w=this.screenToWorld(sx,sy);
    const a=this.findAnimalAt(w.x,w.y);
    if(a){
      const dx=a.x-this.player.x,dy=a.y-this.player.y;
      const len=Math.hypot(dx,dy)||1;
      this.player.faceX=dx/len;this.player.faceY=dy/len;
      this.player.facing=Math.atan2(dy,dx);
    }else{
      const dx=w.x-this.player.x,dy=w.y-this.player.y;
      const len=Math.hypot(dx,dy)||1;
      this.player.faceX=dx/len;this.player.faceY=dy/len;
      this.player.facing=Math.atan2(dy,dx);
    }
    this.throwQueued=true;
  }
  // === 矿石采集 ===
  mineRock(tx,ty){
    const p=this.player;
    const d=Math.hypot(tx-p.x,ty-p.y);
    if(d>2.5){this.showMsg('太远了');return;}
    if(!p.getPosture().canAttack){this.showMsg('卧倒中无法采集');return;}
    if(p.stamina<5){this.showMsg('耐力不足');return;}
    p.stamina-=5;
    if(this.island.obsHeight[ty][tx]>0)this.island.obsHeight[ty][tx]--;
    const roll=Math.random();
    if(roll<0.3){p.inv.ore++;this.showMsg('采矿! 矿石+1');this.playSound('mine');}
    else if(roll<0.5){p.inv.crystal++;this.showMsg('采矿! 水晶+1');this.playSound('mine');}
    else if(roll<0.7){p.inv.stone=(p.inv.stone||0)+1;this.showMsg('采矿! 石头+1');this.playSound('mine');}
    else this.showMsg('采矿... 没挖到什么');
    if(this.island.obsHeight[ty][tx]<=0){
      this.island.tiles[ty][tx]=GRASS;
      this.island.obsHeight[ty][tx]=0;
      p.inv.ore+=2;p.inv.stone=(p.inv.stone||0)+2;
      this.showMsg('矿脉挖尽! 矿石+2 石头+2');
      this.renderTerrain();
    }
    this.updateUI();
  }
  // === 角色径向菜单 ===
  showPlayerMenu(){
    this.closePlayerMenu();
    const ps=this.toScreen(this.player.x,this.player.y,this.player.getHeight(this.island));
    const camSX=(this.camX-this.camY)*TW/2,camSY=(this.camX+this.camY)*TH/2;

      {label:'制作',fn:()=>this.showCraftMenu(px,py)},
      {label:'进食',fn:()=>this.doEat()},
      {label:'存仓',fn:()=>this.doDeposit()},
      {label:'火堆',fn:()=>this.doFire()},

  showCraftMenu(px,py){
    this.closePlayerMenu();
    const menu=document.createElement('div');
    menu.id='player-menu';menu.style.left=px+'px';menu.style.top=py+'px';
    const p=this.player;
    const recipes=[
      {label:'矛+斧',req:()=>p.inv.wood>=1&&p.inv.crystal>=1,fn:()=>{p.inv.wood--;p.inv.crystal--;p.spears+=1;p.axes+=1;this.showMsg('制作 矛+1 斧+1');this.playSound('craft');this.updateUI();}},
      {label:'陷阱',req:()=>p.inv.wood>=2,fn:()=>{p.inv.wood-=2;p.traps+=1;this.showMsg('制作 陷阱+1');this.playSound('craft');this.updateUI();}},
      {label:'麻醉球',req:()=>p.inv.bone>=1&&p.inv.crystal>=1,fn:()=>{p.inv.bone--;p.inv.crystal--;p.tranqs+=2;this.showMsg('制作 麻醉球+2');this.playSound('craft');this.updateUI();}},
      {label:'骨哨',req:()=>p.inv.bone>=2,fn:()=>{p.inv.bone-=2;p.whistles+=1;this.showMsg('制作 骨哨+1');this.playSound('craft');this.updateUI();}},
      {label:'骨器↑',req:()=>p.weaponTier==='stone'&&p.inv.bone>=3&&p.inv.wood>=2,fn:()=>{p.inv.bone-=3;p.inv.wood-=2;p.weaponTier='bone';this.showMsg('武器升级: 骨器!');this.playSound('levelup');this.updateUI();}},
      {label:'金属↑',req:()=>p.weaponTier==='bone'&&p.inv.ore>=3&&p.inv.wood>=2,fn:()=>{p.inv.ore-=3;p.inv.wood-=2;p.weaponTier='metal';this.showMsg('武器升级: 金属器!');this.playSound('levelup');this.updateUI();}},
    ];

      const ang=(n/recipes.length)*Math.PI*2-Math.PI/2;
      const bx=Math.cos(ang)*radius,by=Math.sin(ang)*radius;
      const btn=document.createElement('div');
      btn.className='menu-btn'+(can?'':' disabled');btn.textContent=r.label;
      btn.style.left=bx+'px';btn.style.top=by+'px';btn.style.transform='translate(-50%,-50%)';
      if(can)btn.addEventListener('click',ev=>{ev.stopPropagation();r.fn();this.closePlayerMenu();});
      menu.appendChild(btn);n++;
    });
    // 返回按钮
    const back=document.createElement('div');
    back.className='menu-back';back.textContent='←';back.style.left='0px';back.style.top='0px';
    back.addEventListener('click',ev=>{ev.stopPropagation();this.showPlayerMenu();});
    menu.appendChild(back);
    document.body.appendChild(menu);
    const closer=ev=>{if(!menu.contains(ev.target)){this.closePlayerMenu();document.removeEventListener('mousedown',closer);}};

  closePlayerMenu(){const m=document.getElementById('player-menu');if(m)m.remove();}
  // === B4: 姿态循环 walk→crouch→prone→walk ===
  toggleSneak(){
    const seq=['walk','crouch','prone'];
    const idx=seq.indexOf(this.player.posture);
    this.player.posture=seq[(idx+1)%seq.length];
    const post=this.player.getPosture();
    const btn=document.getElementById('btn-sneak');
    btn.classList.toggle('active',this.player.posture!=='walk');
    const names={walk:'行走',crouch:'蹲伏',prone:'卧倒'};
    this.showMsg(`姿态: ${names[this.player.posture]} (噪${post.noise} 速${post.speed}${post.canAttack?'':' 不可攻击'})`);
  }
  doThrow(){
    const p=this.player,w=p.getWeapon();
    if(!p.getPosture().canAttack){this.showMsg('卧倒中无法投矛, 请起身');return;}
    if(p.spears<=0){this.showMsg('没有矛!');return;}
    if(p.stamina<w.throwStam){this.showMsg('耐力不足');return;}
    p.stamina-=w.throwStam;p.spears--;
    let dx=p.faceX,dy=p.faceY;const len=Math.hypot(dx,dy)||1;dx/=len;dy/=len;
    this.spears_flying.push(new Spear(p.x,p.y,dx,dy,w.spearDmg,w.color,w.spearType));
    this.showMsg('投出'+w.name+'矛!');this.playSound('throw');this.updateUI();
  }
  doMelee(){
    const p=this.player,w=p.getWeapon();
    if(!p.getPosture().canAttack){this.showMsg('卧倒中无法近战, 请起身');return;}
    if(p.axes<=0){this.showMsg('没有武器!');return;}
    if(p.meleeCd>0)return;
    if(p.stamina<w.meleeStam){this.showMsg('耐力不足');return;}
    p.stamina-=w.meleeStam;p.meleeCd=MELEE_CD;this.meleeAnim=0.25;
    // 砍树: 玩家面前1格的TREE
    const ttx=Math.round(p.x+Math.cos(p.facing)*1.0);
    const tty=Math.round(p.y+Math.sin(p.facing)*1.0);
    if(ttx>=0&&ttx<MAP_W&&tty>=0&&tty<MAP_H&&this.island.tiles[tty][ttx]===TREE){
      this.island.obsHeight[tty][ttx]--;
      if(this.island.obsHeight[tty][ttx]<=0){
        const wood=2+Math.floor(Math.random()*2);
        this.island.tiles[tty][ttx]=GRASS;
        this.island.obsHeight[tty][ttx]=0;
        p.inv.wood+=wood;
        this.showMsg(`砍倒树! 木材+${wood}`);
      } else {
        this.showMsg('砍树... '+this.island.obsHeight[tty][ttx]+' hits');
      }
      this.updateUI();
      return;
    }
    let hitAny=false;
    for(const a of this.animals){
      if(a.state==='dead'||a.tamed)continue;
      const dx=a.x-p.x,dy=a.y-p.y;const dist=Math.hypot(dx,dy);
      if(dist>MELEE_RANGE+0.5)continue;
      // 扇形内距离/角度最佳的部位
      let best=null,bestScore=Infinity;
      for(const part of a.parts()){
        const pdx=part.x-p.x,pdy=part.y-p.y;const pd=Math.hypot(pdx,pdy);
        if(pd>MELEE_RANGE)continue;
        const pAng=Math.atan2(pdy,pdx);let pDiff=pAng-p.facing;
        while(pDiff>Math.PI)pDiff-=Math.PI*2;while(pDiff<-Math.PI)pDiff+=Math.PI*2;
        if(Math.abs(pDiff)>MELEE_ARC)continue;
        const score=Math.abs(pDiff)+pd*0.3;
        if(score<bestScore){bestScore=score;best=part;}
      }
      if(best){
        // === C1: 低温时近战伤害x0.8 ===
        const coldDmg=this.player.temp<COLD_TEMP?COLD_DMG_MULT:1;
        a.takeDmgPart(w.axeDmg*coldDmg,best,this,w.axeType);hitAny=true;
        this.showMsg(`${best.label}劈击! x${best.mult} ${a.hp<=0?'击杀!':''}`);this.playSound(a.hp<=0?'death':'hit');
      } else if(dist<=MELEE_RANGE){
        // 扇形内无部位, 但身体在范围内 -> 普通命中
        const ang=Math.atan2(dy,dx);let diff=ang-p.facing;
        while(diff>Math.PI)diff-=Math.PI*2;while(diff<-Math.PI)diff+=Math.PI*2;
        if(Math.abs(diff)<=MELEE_ARC){
          a.takeDmg(w.axeDmg*(p.temp<COLD_TEMP?COLD_DMG_MULT:1),false,this);hitAny=true;
          this.showMsg(`命中 ${a.hp<=0?'击杀!':Math.floor(a.hp)+'/'+a.maxHp}`);
        }
      }
    }
    if(!hitAny)this.showMsg('挥空!');
    this.updateUI();
  }
  doTrap(){
    const p=this.player;
    if(p.traps<=0){this.showMsg('没有陷阱! 木2制作');return;}
    if(p.stamina<5){this.showMsg('耐力不足');return;}
    p.stamina-=5;p.traps--;
    this.traps.push(new Trap(p.x,p.y));
    this.showMsg('放置陷阱!');this.updateUI();
  }
  // 麻醉球: 对虚弱(HP<25%)且在陷阱中的动物投掷, 累积睡眠, 满2发捕获(参考怪猎捕获)
  doTranq(){
    const p=this.player;
    if(p.tranqs<=0){this.showMsg('没有麻醉球! 骨1+晶1制作');return;}
    // 找最近的、在陷阱中且HP<25%的动物
    let target=null,bestD=Infinity;
    for(const a of this.animals){
      if(a.state==='dead'||a.tamed)continue;
      const inTrap=this.traps.some(t=>!t.dead&&Math.hypot(t.x-a.x,t.y-a.y)<1.2);
      if(!inTrap)continue;
      if(a.hp/a.maxHp>0.25)continue;
      const d=Math.hypot(a.x-p.x,a.y-p.y);
      if(d<SPEAR_RANGE&&d<bestD){bestD=d;target=a;}
    }
    if(!target){this.showMsg('需陷阱中虚弱(HP<25%)的动物');return;}
    p.tranqs--;
    // === D1: 眩晕值系统 - 累积torpor, 满100晕倒 ===
    if(target.sleepT>0){
      // 已晕倒 -> 捕获(获得稀有素材, 不留尸体)
      const isWolf=target.type==='wolf';
      p.inv.bone+=isWolf?3:2;p.inv.hide+=isWolf?2:1;p.inv.meat+=isWolf?1:3;
      if(isWolf)p.inv.ore+=1;else p.inv.crystal+=1;
      if(target.level>=4){p.inv.bone+=1;p.inv.hide+=1;}
      this.showMsg(`★捕获${isWolf?'狼':'鹿'}成功! 稀有素材`);
      const idx=this.animals.indexOf(target);if(idx>=0)this.animals.splice(idx,1);
    } else {
      target.torpor=Math.min(TORPOR_MAX,target.torpor+TORPOR_PER_TRANQ);
      if(target.torpor>=TORPOR_MAX){
        target.sleepT=10;target.state='graze';
        this.showMsg(`★${target.type==='wolf'?'狼':'鹿'}被麻醉晕倒! 可喂食驯服或再投麻醉捕获`);
      } else {
        this.showMsg(`麻醉命中! 眩晕${Math.floor(target.torpor)}/${TORPOR_MAX}`);
      }
    }
    this.updateUI();
  }
  // === D2/D3: 喂食驯服 - 晕倒动物可喂食, 鹿可和平驯服(蹲伏靠近) ===
  doFeed(){
    const p=this.player;
    let target=null,bestD=Infinity;
    for(const a of this.animals){
      if(a.state==='dead'||a.tamed)continue;
      // 晕倒的动物(任何) 或 蹲伏靠近的鹿(和平驯服)
      const canFeed=a.sleepT>0||(a.type==='deer'&&a.state==='graze'&&p.posture!=='walk');
      if(!canFeed)continue;
      const d=Math.hypot(a.x-p.x,a.y-p.y);
      if(d<2.0&&d<bestD){bestD=d;target=a;}
    }
    if(!target){this.showMsg('无动物可喂食(需晕倒动物 或 蹲伏靠近鹿)');return;}
    // 偏好食物: 鹿=水晶(树汁), 狼=肉
    const pref=target.type==='deer'?'crystal':'meat';
    const other=target.type==='deer'?'meat':'crystal';
    if(p.inv[pref]>0){
      p.inv[pref]--;
      target.tameProgress=Math.min(TAME_MAX,target.tameProgress+TAME_FOOD_RIGHT);
      target.tameEffectiveness=Math.min(1,target.tameEffectiveness+0.1);
      this.showMsg(`喂${target.type==='deer'?'鹿':'狼'} ${pref==='crystal'?'水晶':'肉'}! 驯服${Math.floor(target.tameProgress)}/${TAME_MAX} (有效${Math.floor(target.tameEffectiveness*100)}%)`);
    } else if(p.inv[other]>0){
      p.inv[other]--;
      target.tameProgress=Math.min(TAME_MAX,target.tameProgress+TAME_FOOD_WRONG);
      target.tameEffectiveness=Math.max(0.3,target.tameEffectiveness-0.15);
      this.showMsg(`喂了不喜欢的食物... 驯服${Math.floor(target.tameProgress)}/${TAME_MAX} (有效${Math.floor(target.tameEffectiveness*100)}%)`);
    } else {
      this.showMsg(`需要${pref==='crystal'?'水晶':'肉'}来驯服`);return;
    }
    // 驯服完成
    if(target.tameProgress>=TAME_MAX){
      target.tamed=true;target.state='graze';target.sleepT=0;
      target.role=TAME_ROLE[target.type];
      const bonus=target.tameEffectiveness>=0.8?'(高有效性,属性+20%)':'';
      this.showMsg(`★驯服${target.type==='wolf'?'猎犬':'驮兽'}成功! ${bonus}`);
    }
    this.updateUI();
  }
  // 火堆: 木3+石2制作并放置, 燃烧120秒, 3格内保暖+夜视+驱狼
  doFire(){

    this.fires.push(new Fire(p.x,p.y));

  }

  doDrink(){

  // 睡眠: 在营地HOME旁休息, 跳过夜晚到白天, 恢复HP/耐力(消耗饥饿)
  doSleep(){
    const p=this.player;
    const ix=Math.round(p.x),iy=Math.round(p.y);
    if(ix!==this.island.home.x||iy!==this.island.home.y){this.showMsg('回营地才能睡觉');return;}
    if(this.dayTime<50){this.showMsg('白天不需要睡觉');return;}
    if(p.hunger<20){this.showMsg('太饿了睡不着');return;}

    this.dayTime=10;this.showMsg('睡了一觉, 跳到白天 +30血 +满耐力');this.playSound('sleep');this.updateUI();

  // 骨哨: 吹哨吸引鹿(10格内走向玩家), 吓跑狼(8格内逃跑)
  doWhistle(){
    const p=this.player;
    if(p.whistles<=0){this.showMsg('没有骨哨! 骨2制作');return;}
    p.whistles--;
    // === B6: 物种特异叫声 - deerCall吸引鹿, wolfCall吸引狼(高风险) ===
    const isWolfCall=p.callType==='wolf';
    let lured=0,target=isWolfCall?'wolf':'deer';
    for(const a of this.animals){
      if(a.state==='dead')continue;
      const d=Math.hypot(a.x-p.x,a.y-p.y);
      if(d<CALL_RADIUS){
        if(a.type===target){
          // 吸引目标物种朝玩家来
          a.state='graze';
          a.facingTarget=Math.atan2(p.y-a.y,p.x-a.x);
          a.lureT=CALL_LURE_T;
          lured++;
        } else if(!isWolfCall&&a.type==='wolf'){
          // 鹿笛吓跑狼(原有行为)
          a.state='flee';a.chaseT=0;
        } else if(isWolfCall&&a.type==='deer'){
          // 狼笛吓跑鹿
          a.state='flee';a.chaseT=0;
        }
      }
    }
    this.showMsg(`吹${isWolfCall?'狼':'鹿'}笛! 吸引${lured}只${isWolfCall?'狼':'鹿'}`);this.playSound('whistle');this.updateUI();
  }
  toggleCall(){
    this.player.callType=this.player.callType==='deer'?'wolf':'deer';
    this.showMsg(`叫声切换为: ${this.player.callType==='deer'?'鹿笛(吸引鹿)':'狼笛(吸引狼,危险!)'}`);
  }
  doCollect(){
    for(let i=0;i<this.animals.length;i++){
      const a=this.animals[i];
      if(a.state==='dead'&&!a.looted&&Math.hypot(a.x-this.player.x,a.y-this.player.y)<1.2){
        a.looted=true;
        const part=a.lastHitPart;
        const names={hide:'皮',meat:'肉',bone:'骨'};
        if(part&&part.drop){
          for(const k in part.drop)this.player.inv[k]=(this.player.inv[k]||0)+part.drop[k];
          const summary=Object.entries(part.drop).map(([k,v])=>(names[k]||k)+'+'+v).join(' ');
          this.showMsg(`采集 ${part.label}部: ${summary}`);this.playSound('collect');
        } else {
          this.player.inv.meat+=1;this.player.inv.hide+=1;
          this.showMsg('采集 皮+1 肉+1');this.playSound('collect');
        }
        // 立即移除尸体, 不留残留
        this.animals.splice(i,1);
        this.updateUI();return;
      }
    }
    const r=this.player.collect(this.island);const names={crystal:'水晶',hide:'兽皮',wood:'木材',ore:'矿石'};
    this.showMsg(r?`采集到 ${names[r]||r}`:'这里没有资源');this.updateUI();
  }
  canFish(){const p=this.player,is=this.island;const ix=Math.round(p.x),iy=Math.round(p.y);if(is.tiles[iy][ix]!==SAND)return false;for(const[dx,dy]of[[1,0],[-1,0],[0,1],[0,-1]]){const nx=ix+dx,ny=iy+dy;if(nx>=0&&nx<MAP_W&&ny>=0&&ny<MAP_H&&is.tiles[ny][nx]===WATER)return true;}return false;}
  doFish(){if(!this.canFish()){this.showMsg('要在沙滩旁有水处捕鱼');return;}if(Math.random()<0.7){this.player.inv.fish++;this.showMsg('捕到鱼!');this.playSound('fish');}else this.showMsg('没捕到...');this.updateUI();}
  doDeposit(){const ix=Math.round(this.player.x),iy=Math.round(this.player.y);if(ix===this.island.home.x&&iy===this.island.home.y){this.player.deposit();this.showMsg('已存入营地');}else this.showMsg('回营地存');this.updateUI();}
  doEat(){const p=this.player;
    if(p.inv.meat>0){p.inv.meat--;p.hunger=Math.min(100,p.hunger+40);p.hp=Math.min(PLAYER_MAX_HP,p.hp+8);this.showMsg('吃兽肉 +40饱 +8血');this.playSound('eat');}
    else if(p.storage.meat>0){p.storage.meat--;p.hunger=Math.min(100,p.hunger+40);p.hp=Math.min(PLAYER_MAX_HP,p.hp+8);this.showMsg('营地吃肉 +40饱 +8血');this.playSound('eat');}
    else if(p.inv.fish>0){p.inv.fish--;p.hunger=Math.min(100,p.hunger+45);this.showMsg('吃鱼 +45');this.playSound('eat');}
    else if(p.storage.fish>0){p.storage.fish--;p.hunger=Math.min(100,p.hunger+45);this.showMsg('营地吃鱼 +45');this.playSound('eat');}
    else this.showMsg('没食物!');
    this.updateUI();
  }
  doCraft(){
    const p=this.player;
    // 循环升级: stone→bone→metal, 或制作武器
    if(p.weaponTier==='stone'&&p.inv.bone>=3&&p.inv.wood>=2){p.inv.bone-=3;p.inv.wood-=2;p.weaponTier='bone';this.showMsg('武器升级: 骨器! 伤害提升');}
    else if(p.weaponTier==='bone'&&p.inv.ore>=3&&p.inv.wood>=2){p.inv.ore-=3;p.inv.wood-=2;p.weaponTier='metal';this.showMsg('武器升级: 金属器! 伤害大幅提升');}
    else if(p.inv.wood>=1&&p.inv.crystal>=1){p.inv.wood--;p.inv.crystal--;p.spears+=1;p.axes+=1;this.showMsg('制作 矛+1 斧+1');}
    else if(p.inv.wood>=2){p.inv.wood-=2;p.traps+=1;this.showMsg('制作 陷阱+1');}
    else if(p.inv.bone>=1&&p.inv.crystal>=1){p.inv.bone--;p.inv.crystal--;p.tranqs+=2;this.showMsg('制作 麻醉球+2');}
    else if(p.inv.bone>=2){p.inv.bone-=2;p.whistles+=1;this.showMsg('制作 骨哨+1');}
    else this.showMsg('需要: 木+晶(武器) / 木2(陷阱) / 骨1+晶1(麻醉球) / 骨2(骨哨) / 骨3+木2(骨器) / 矿3+木2(金属)');
    this.playSound('craft');this.updateUI();
  }
  showMsg(t){this.msg=t;this.msgTimer=100;}
  // === 音效系统: WebAudio合成 ===
  playSound(type){
    if(!this._audioReady){this.audioCtx=new(AudioContext||webkitAudioContext)();this._audioReady=true;}
    const ctx=this.audioCtx;if(!ctx)return;
    const now=ctx.currentTime;
    const tone=(freq,dur,vol,type='sine',delay=0)=>{
      const o=ctx.createOscillator(),g=ctx.createGain();
      o.connect(g);g.connect(ctx.destination);
      o.type=type;o.frequency.value=freq;
      g.gain.setValueAtTime(0,now+delay);
      g.gain.linearRampToValueAtTime(vol,now+delay+0.01);
      g.gain.exponentialRampToValueAtTime(0.001,now+delay+dur);
      o.start(now+delay);o.stop(now+delay+dur);
    };
    const noise=(dur,vol,filterFreq=1000,delay=0)=>{
      const buf=ctx.createBuffer(1,ctx.sampleRate*dur,ctx.sampleRate);
      const d=buf.getChannelData(0);
      for(let i=0;i<d.length;i++)d[i]=(Math.random()*2-1)*Math.pow(1-i/d.length,2);
      const s=ctx.createBufferSource();s.buffer=buf;
      const f=ctx.createBiquadFilter();f.type='lowpass';f.frequency.value=filterFreq;
      const g=ctx.createGain();g.gain.value=vol;
      s.connect(f);f.connect(g);g.connect(ctx.destination);
      s.start(now+delay);
    };
    switch(type){
      case'hit':tone(180,0.12,0.3,'square');noise(0.08,0.15,800);break;          // 击中
      case'collect':tone(440,0.1,0.2,'sine');tone(660,0.1,0.15,'sine',0.08);break; // 采集成功
      case'hurt':tone(120,0.2,0.35,'sawtooth');noise(0.1,0.2,500);break;          // 被攻击
      case'eat':tone(300,0.08,0.15,'sine');tone(400,0.08,0.12,'sine',0.06);tone(500,0.1,0.1,'sine',0.14);break; // 进食
      case'drink':tone(200,0.15,0.12,'sine');tone(250,0.1,0.1,'sine',0.08);break;  // 喝水
      case'craft':tone(150,0.1,0.2,'square');noise(0.15,0.1,1200);tone(200,0.08,0.15,'square',0.1);break; // 制作
      case'throw':tone(800,0.06,0.15,'sine');tone(400,0.08,0.1,'sine',0.06);break; // 投矛
      case'sleep':tone(200,0.3,0.15,'sine');tone(150,0.4,0.12,'sine',0.2);break;    // 睡觉
      case'whistle':tone(1200,0.15,0.2,'sine');tone(1500,0.1,0.15,'sine',0.08);break; // 骨哨
      case'fish':tone(300,0.1,0.15,'sine');noise(0.2,0.08,600,0.1);break;           // 捕鱼
      case'mine':tone(100,0.08,0.25,'square');noise(0.06,0.15,2000);break;          // 采矿
      case'death':tone(150,0.3,0.3,'sawtooth');tone(80,0.5,0.2,'sine',0.15);break;  // 动物死亡
      case'tame':tone(523,0.1,0.2,'sine');tone(659,0.1,0.2,'sine',0.1);tone(784,0.2,0.2,'sine',0.2);break; // 驯服成功
      case'levelup':tone(523,0.08,0.2,'square');tone(659,0.08,0.2,'square',0.08);tone(784,0.12,0.2,'square',0.16);break; // 升级
    }
  }
  visible(x,y){
    // === E1: 天气影响视野 ===
    let near=VISION_NEAR,far=VISION_FAR;
    if(this.weather==='rain'){near=Math.max(3,near+RAIN_VIS);far=Math.max(5,far+RAIN_VIS);}
    else if(this.weather==='fog'){near=Math.max(3,near+FOG_VIS);far=Math.max(5,far+FOG_VIS);}
    const d=Math.hypot(x-this.player.x,y-this.player.y);
    if(d<=near)return'near';if(d<=far)return'far';return null;
  }
  updateMemory(){const px=Math.round(this.player.x),py=Math.round(this.player.y);const newly=[];for(let dy=-VISION_FAR;dy<=VISION_FAR;dy++)for(let dx=-VISION_FAR;dx<=VISION_FAR;dx++){const tx=px+dx,ty=py+dy;if(tx>=0&&tx<MAP_W&&ty>=0&&ty<MAP_H){if(!this.island.memory[ty][tx]){this.island.memory[ty][tx]=true;newly.push({x:tx,y:ty});}}}if(newly.length>0){this._off=true;for(const t of newly)this.drawTile(t.x,t.y);this._off=false;}}
  update(dt){
    let{dx,dy}=this.getKeys();
    if(dx===0&&dy===0){dx=this.moveDX;dy=this.moveDY;}
    // === 双击移动: 无键盘输入时自动走向moveTarget ===
    if(dx===0&&dy===0&&this.moveTarget){
      const mdx=this.moveTarget.x-this.player.x,mdy=this.moveTarget.y-this.player.y;
      const mdist=Math.hypot(mdx,mdy);
      if(mdist<0.4){this.moveTarget=null;this.showMsg('到达目标');}
      else{dx=mdx/mdist;dy=mdy/mdist;}
    }else if(dx!==0||dy!==0){this.moveTarget=null;} // 键盘操作取消自动移动
    const len=Math.hypot(dx,dy);
    if(len>0.1){dx/=len;dy/=len;this.player.faceX=dx;this.player.faceY=dy;this.player.facing=Math.atan2(dy,dx);}
    else{dx=0;dy=0;}
    if(dx||dy){
      const post=this.player.getPosture();
      const speed=post.speed*dt;
      const nx=this.player.x+dx*speed,ny=this.player.y+dy*speed;
      const curH=this.island.getElevAt(this.player.x,this.player.y);
      const tgtH=this.island.getElevAt(nx,ny);const diff=tgtH-curH;
      const maxUp=this.jumpQueued?1.2:0.5;
      if(this.island.walkable(nx,ny)&&diff<=maxUp&&diff>=-2){this.player.x=nx;this.player.y=ny;this.player.stamina=Math.max(0,this.player.stamina-STAM_MOVE_DRAIN*dt);}
      // === B4: 玩家移动噪音由姿态决定 ===
      this.player.noise=post.noise;
    } else {
      this.player.noise=0;
    }
    this.jumpQueued=false;
    if(this.throwQueued){this.doThrow();this.throwQueued=false;}
    if(this.meleeQueued){this.doMelee();this.meleeQueued=false;}
    if(this.player.meleeCd>0)this.player.meleeCd-=dt;
    if(this.meleeAnim>0)this.meleeAnim-=dt;
    // 耐力恢复(饥饿/口渴低时恢复减半, 低温时恢复减慢)
    const p=this.player;
    let stamMult=(p.hunger<30||p.thirst<20)?0.5:1;
    // === C1: 体温联动 - 低温耐力恢复x0.7, 高温耐力上限x0.8 ===
    const cold=p.temp<COLD_TEMP,hot=p.temp>HOT_TEMP;
    if(cold)stamMult*=COLD_STAM_REGEN;
    const stamMax=hot?PLAYER_MAX_STAM*HOT_STAM_MAX:PLAYER_MAX_STAM;
    if(dx===0&&dy===0)p.stamina=Math.min(stamMax,p.stamina+STAM_REGEN*1.5*stamMult*dt);
    else p.stamina=Math.min(stamMax,p.stamina+STAM_REGEN*0.3*stamMult*dt);
    if(p.invuln>0)p.invuln-=dt;
    // 动物
    for(const a of this.animals)a.update(dt,this);
    this.animals=this.animals.filter(a=>!(a.state==='dead'&&a.deadTimer<=0));
    if(this.animals.length<10){const s=this.island.spawnPoint(this.island.home,WOLF_CHASE*3);if(this.getPressure(s.x,s.y)<3){const a=new Animal(s.x,s.y,Math.random()<0.6?'deer':'wolf');a.initNeedZones(this.island);this.animals.push(a);}}
    // 矛
    for(const s of this.spears_flying)s.update(dt,this);
    this.spears_flying=this.spears_flying.filter(s=>!s.dead);
    // 陷阱
    for(const t of this.traps){if(t.triggerT>0){t.triggerT-=dt;if(t.triggerT<=0)t.dead=true;}}
    this.traps=this.traps.filter(t=>!t.dead);
    // 火堆燃烧
    for(const f of this.fires){f.burnT-=dt;if(f.burnT<=0)f.dead=true;}
    this.fires=this.fires.filter(f=>!f.dead);
    // === A5: 拾取物寿命衰减 + 自动拾取 ===
    for(const pk of this.pickups)pk.life-=dt;
    this.pickups=this.pickups.filter(pk=>pk.life>0);
    this.collectPickups();
    // 风向: 每WIND_CHANGE_INTERVAL秒随机变化
    this.windT+=dt;
    if(this.windT>=WIND_CHANGE_INTERVAL){this.windT=0;this.windAng=Math.random()*Math.PI*2;}
